<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>からくり惑星の影 | ARテスト</title>
<style>
body{margin:24px auto;padding:0 20px;max-width:600px;background:#10181c;color:#eee9dd;font:16px/1.65 system-ui,sans-serif}
#preview{height:clamp(300px,58svh,530px);background:#19282a;border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
button{padding:12px 16px;border:0;border-radius:8px;background:#d2b17d;color:#152528;font:inherit;font-weight:600}
button:disabled{opacity:.55}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}
a{color:#e5bc80}
.iphone-ar img{display:block;width:132px;border-radius:8px}
.iphone-ar{display:inline-block}
#xr-hint{display:none;pointer-events:none}
#xr-hint:fullscreen{background:transparent}
#xr-hint:xr-overlay{display:block;position:fixed;inset:auto 12px 24px;padding:12px;background:#10181cd9;color:#fff;text-align:center;border-radius:8px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>

<body>
<main>
<h1>からくり惑星の影</h1>
<p>斜め上から光を当てています。リングが回ると、青緑の惑星を細い影が横切ります。</p>
<h2>iPhoneで試す</h2>
<p>Safariで画像をタップし、ARで机に置いてください。</p>
<h3>連続移動する影の帯（試作）</h3>
<p>リング1本分の影を、小さな帯に分けて惑星の表面に沿って動かします。</p>
<a class="iphone-ar" rel="ar" href="./planet-ar-shadow-transform.usdz"><img src="../clockwork-planet/poster.png" alt="連続移動する影の帯をiPhoneのARで開く"></a>
<details>
<summary>8コマ版・12コマ版と見比べる</summary>
<h3>毎秒8コマ</h3>
<a class="iphone-ar" rel="ar" href="./planet-ar-shadow.usdz"><img src="../clockwork-planet/poster.png" alt="毎秒8コマの影つきARを開く"></a>
<h3>毎秒12コマ</h3>
<a class="iphone-ar" rel="ar" href="./planet-ar-shadow-12fps.usdz"><img src="../clockwork-planet/poster.png" alt="毎秒12コマの影つきARを開く"></a>
</details>
<h2>Pixel 7で試す</h2>
<div id="preview" aria-label="回転するからくり惑星の3Dプレビュー"></div>
<div class="controls">
  <button id="start" disabled>机に置く（AR）</button>
  <label><input id="shadows" type="checkbox" checked> リングの影を表示</label>
</div>
<p id="status" role="status">3Dモデルを読み込んでいます…</p>
<p>Pixel 7のChromeでARを起動し、机にカメラを向けます。輪が出たら、置きたい場所で画面をタップしてください。</p>
<p><a href="../clockwork-planet/">通常版のからくり惑星へ</a></p>
</main>
<div id="xr-hint">机にカメラを向け、輪が出た場所をタップ</div>
<script type="module">
import('./shadow.js').catch(error => {
  document.querySelector('#status').textContent = '3D表示を開始できませんでした。Chromeでページを開き直してください。';
  console.error(error);
});
</script>
</body>
</html>
