<h1>卓上のからくり惑星</h1>
<p>iPhoneはSafariで画像をタップし、「AR」を選んでください。AndroidはChromeで画像の下のボタンをタップしてください。</p>
<a rel="ar" href="./planet-ar-motion.usdz"><img src="./poster.png" alt="回転するからくり惑星をARで開く"></a>
<a class="android" href="intent://arvr.google.com/scene-viewer/1.0?file=https%3A%2F%2Fnao-matsunami.github.io%2Fblender-generative-lab-pages%2Far%2Fclockwork-planet%2Fplanet-ar.glb&amp;mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https%3A%2F%2Fnao-matsunami.github.io%2Fblender-generative-lab-pages%2Far%2Fclockwork-planet%2F%23android-help;end;">Androidで机に置く（AR）</a>
<p id="android-help">AndroidでARが開かない場合は、Chromeでこのページを開き、<a href="https://play.google.com/store/apps/details?id=com.google.ar.core">Google Play 開発者サービス（AR）</a>が最新版か確認してください。</p>
<p>カメラを机に向けて惑星を置き、リングや月の回転を眺めてみてください。</p>
