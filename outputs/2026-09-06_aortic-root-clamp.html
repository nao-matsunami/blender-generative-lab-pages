<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aortic Root Clamp / Blender Generative Lab</title>
    <style>
      :root { color-scheme:dark; --bg:#060102; --ink:#f8eeee; --muted:#c9a1a4; --accent:#ff5862; }
      * { box-sizing:border-box; }
      html,body { width:100%; height:100%; }
      body { margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 48%, rgba(122,7,24,.34), transparent 32%), radial-gradient(circle at 50% 70%, rgba(34,1,9,.48), transparent 34%), var(--bg); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
      canvas:active { cursor:grabbing; }
      .hud { position:fixed; inset:18px 18px auto; z-index:2; display:flex; justify-content:space-between; gap:18px; pointer-events:none; text-shadow:0 2px 18px rgba(0,0,0,.84); }
      h1 { margin:0; font-size:clamp(20px,3vw,42px); line-height:1; letter-spacing:0; text-transform:uppercase; }
      p { margin:8px 0 0; max-width:780px; color:var(--muted); font-size:clamp(12px,1.3vw,15px); line-height:1.55; }
      a { pointer-events:auto; align-self:flex-start; min-width:112px; padding:10px 13px; border:1px solid rgba(248,238,238,.28); background:rgba(6,1,2,.58); color:var(--ink); font-size:12px; line-height:1; text-align:center; text-decoration:none; backdrop-filter:blur(12px); }
      .meter { position:fixed; right:18px; bottom:18px; left:18px; z-index:2; height:2px; overflow:hidden; background:rgba(248,238,238,.12); }
      .meter span { display:block; width:100%; height:100%; transform-origin:left center; background:linear-gradient(90deg,#34030b,var(--accent),#f8eeee); animation:loop-meter 24s linear infinite; }
      .version { position:fixed; left:18px; bottom:26px; z-index:2; color:var(--accent); font-size:11px; letter-spacing:0; text-transform:uppercase; pointer-events:none; text-shadow:0 2px 14px rgba(0,0,0,.82); }
      @keyframes loop-meter { from { transform:scaleX(0); } to { transform:scaleX(1); } }
      @media (max-width:720px) { .hud{display:block} a{display:inline-block;margin-top:12px} }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Aortic Root Clamp procedural preview"></canvas>
    <div class="hud"><div><h1>Aortic Root Clamp</h1><p>Organic Motion Objects / heart-root abstraction / thick structural roots pressed into a dark chamber socket</p></div><a href="../days/2026-09-06.html">Daily report</a></div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.09.06</div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:"high-performance" });
      renderer.setClearColor(0x060102, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.38;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x060102, .024);
      const camera = new THREE.PerspectiveCamera(39, 1, .1, 90);
      const object = new THREE.Group();
      object.rotation.x = .38;
      object.rotation.z = -.19;
      scene.add(object);
      const controls = { rx:.38, ry:0, trx:.38, try:0, pan:new THREE.Vector2(), tpan:new THREE.Vector2(), dist:5.8, tdist:5.8, pointers:new Map(), lastCenter:null, lastDistance:0, dragMode:"rotate" };
      const chamberMat = new THREE.MeshStandardMaterial({ color:0xaa2233, emissive:0x250006, emissiveIntensity:.08, roughness:.16, metalness:0, vertexColors:true });
      const tubeMat = new THREE.MeshStandardMaterial({ color:0x780612, emissive:0x260005, emissiveIntensity:.1, roughness:.17, metalness:0 });
      const padMat = new THREE.MeshStandardMaterial({ color:0xc72d39, emissive:0x260006, emissiveIntensity:.07, roughness:.18, metalness:0 });
      const darkMat = new THREE.MeshStandardMaterial({ color:0x050002, roughness:.62 });
      object.add(new THREE.Mesh(createChamberGeometry(), chamberMat));
      const socket = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 24), darkMat);
      socket.position.set(0, -.66, .08);
      socket.scale.set(.46, .18, .46);
      object.add(socket);
      addTube([[-.15,-.66,.08],[-.08,-.86,.46],[.04,-1.02,.9],[.16,-1.14,1.28]], .13);
      addTube([[-.12,-.66,.02],[-.44,-.82,.16],[-.72,-.91,.25],[-1,-.94,.31]], .115);
      addTube([[.14,-.66,.02],[.44,-.82,-.06],[.72,-.91,-.16],[1,-.94,-.27]], .11);
      for (const [x, y, z, sx, sy, sz] of [[-.27,-.68,.04,.24,.075,.18],[.25,-.68,0,.24,.075,.18],[0,-.72,.32,.22,.075,.17]]) {
        const pad = new THREE.Mesh(new THREE.SphereGeometry(1, 42, 16), padMat);
        pad.position.set(x, y, z);
        pad.scale.set(sx, sy, sz);
        object.add(pad);
      }
      const key = new THREE.DirectionalLight(0xff766f, 7.4);
      key.position.set(-3, -2.6, 4.9);
      scene.add(key);
      const rim = new THREE.PointLight(0x8e0b1e, 6.8, 14);
      rim.position.set(2.7, 1.6, 2.8);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffb7ae, 0x090103, 1.9));
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());
      canvas.addEventListener("wheel", onWheel, { passive:false });
      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);
      function render() { const elapsed = performance.now() / 1000; controls.rx += (controls.trx - controls.rx) * .14; controls.ry += (controls.try - controls.ry) * .14; controls.pan.lerp(controls.tpan, .16); controls.dist += (controls.tdist - controls.dist) * .16; object.rotation.x = controls.rx + Math.sin(elapsed * .48) * .014; object.rotation.y = elapsed * Math.PI * 2 / 78 + controls.ry; camera.position.set(controls.pan.x - .06, controls.pan.y + .01, controls.dist); camera.lookAt(controls.pan.x, controls.pan.y - .03, 0); renderer.render(scene, camera); }
      function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
      function onWheel(event) { event.preventDefault(); controls.tdist = clamp(controls.tdist + event.deltaY * .0028, 3.2, 9); }
      function onPointerDown(event) { canvas.setPointerCapture(event.pointerId); controls.pointers.set(event.pointerId, point(event)); controls.dragMode = event.button === 2 || event.shiftKey ? "pan" : "rotate"; updateMemory(); }
      function onPointerMove(event) { if (!controls.pointers.has(event.pointerId)) return; const prev = controls.pointers.get(event.pointerId); const cur = point(event); controls.pointers.set(event.pointerId, cur); if (controls.pointers.size >= 2) { pinchPan(); return; } const dx = cur.x - prev.x, dy = cur.y - prev.y; if (controls.dragMode === "pan") panBy(dx, dy); else { controls.try += dx * .008; controls.trx = clamp(controls.trx + dy * .006, -.9, 1.55); } }
      function onPointerUp(event) { controls.pointers.delete(event.pointerId); try { canvas.releasePointerCapture(event.pointerId); } catch {} updateMemory(); }
      function point(event) { return { x:event.clientX, y:event.clientY }; }
      function updateMemory() { const p = [...controls.pointers.values()]; controls.lastCenter = p.length >= 2 ? center(p[0], p[1]) : null; controls.lastDistance = p.length >= 2 ? distance(p[0], p[1]) : 0; }
      function pinchPan() { const p = [...controls.pointers.values()]; const c = center(p[0], p[1]); const d = distance(p[0], p[1]); if (controls.lastCenter) panBy(c.x - controls.lastCenter.x, c.y - controls.lastCenter.y); if (controls.lastDistance > 0) controls.tdist = clamp(controls.tdist * (controls.lastDistance / Math.max(40, d)), 3.2, 9); controls.lastCenter = c; controls.lastDistance = d; }
      function panBy(dx, dy) { const scale = controls.tdist * .0015; controls.tpan.x = clamp(controls.tpan.x - dx * scale, -1.2, 1.2); controls.tpan.y = clamp(controls.tpan.y + dy * scale, -.8, .8); }
      function center(a, b) { return { x:(a.x + b.x) * .5, y:(a.y + b.y) * .5 }; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function smoothstep(edge0, edge1, x) { const t = clamp((x - edge0) / (edge1 - edge0), 0, 1); return t * t * (3 - 2 * t); }
      function clampField(u, v) { const theta = u * Math.PI * 2; return smoothstep(.05, .9, .5 + .5 * Math.sin(theta - .15)) * Math.exp(-(((v - .48) / .22) ** 2)); }
      function foldField(u, v) { const theta = u * Math.PI * 2, clampValue = clampField(u, v); let rib = 0; for (let i = 0; i < 12; i += 1) { const centerValue = (i / 12 + .2 * v + .035 * Math.sin(v * Math.PI * 2)) % 1; const d = Math.abs(((u - centerValue + .5) % 1) - .5); rib += Math.max(0, 1 - d / .032) ** 2.2; } return Math.min(1, clampValue * .55 + rib * .28 + (.5 + .5 * Math.sin(theta * 2 + v * Math.PI * 2.2)) * .12); }
      function createChamberGeometry() {
        const uSeg = 126, vSeg = 68, positions = [], colors = [], indices = [], color = new THREE.Color();
        for (let y = 0; y <= vSeg; y += 1) {
          const v = y / vSeg, phi = -Math.PI / 2 + (.012 + v * .976) * Math.PI, dome = Math.max(0, Math.cos(phi));
          for (let x = 0; x < uSeg; x += 1) {
            const u = x / uSeg, theta = u * Math.PI * 2, clampValue = clampField(u, v), fold = foldField(u, v), chamber = 1 + .13 * Math.sin(theta + .3) + .08 * Math.cos(phi * 1.4);
            const rx = .98 * chamber * (1 - .3 * clampValue) + fold * .11, ry = .7 * (1 + .1 * Math.cos(theta * 2)) - clampValue * .33, rz = 1.05 * (1 + .08 * Math.sin(theta - .2));
            positions.push(Math.cos(theta) * dome * rx + .08 * Math.sin(phi * 1.8), Math.sin(theta) * dome * ry - clampValue * .27, Math.sin(phi) * rz + dome * Math.sin(theta * 2 - .8) * .11);
            const wet = .5 + .5 * Math.sin(theta * 2.7 + v * Math.PI * 4.2), crease = Math.min(.9, fold * .7 + clampValue * .22);
            color.setRGB(.64 + wet * .14 - crease * .4, .11 + wet * .05 - crease * .09, .17 + wet * .05 - crease * .12);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vSeg; y += 1) for (let x = 0; x < uSeg; x += 1) { const a = y * uSeg + x, b = y * uSeg + ((x + 1) % uSeg), c = (y + 1) * uSeg + ((x + 1) % uSeg), d = (y + 1) * uSeg + x; indices.push(a, b, d, b, c, d); }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }
      function addTube(points, radius) { const curve = new THREE.CatmullRomCurve3(points.map(([x,y,z]) => new THREE.Vector3(x,y,z))); object.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 72, radius, 20, false), tubeMat)); }
    </script>
  </body>
