<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adhesive Spleen Fold / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070103;
        --ink: #f7eeee;
        --muted: #bfa4aa;
        --accent: #ff6874;
        --deep: #650b1c;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 48% 48%, rgba(156, 18, 48, 0.28), transparent 34%),
          radial-gradient(circle at 50% 70%, rgba(48, 2, 16, 0.38), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.84);
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 780px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(7, 1, 3, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #3c0512, var(--accent), #f7eeee);
        animation: loop-meter 22s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Adhesive Spleen Fold procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Adhesive Spleen Fold</h1>
        <p>Organic Motion Objects / spleen-membrane abstraction / pressed lobes, fused seams, dark contact slits</p>
      </div>
      <a href="../days/2026-08-31.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.31</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.42;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.023);

      const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 90);
      camera.position.set(-0.06, 0.02, 5.9);
      camera.lookAt(0, -0.03, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.66;
      object.rotation.z = -0.18;
      scene.add(object);

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xc6465b,
        emissive: 0x26030c,
        emissiveIntensity: 0.12,
        roughness: 0.2,
        metalness: 0.0,
        vertexColors: true,
      });
      const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x070004, roughness: 0.52 });
      const lipMaterial = new THREE.MeshStandardMaterial({ color: 0xa81f35, emissive: 0x240006, emissiveIntensity: 0.1, roughness: 0.17, metalness: 0.0 });

      for (let index = 0; index < 3; index += 1) {
        object.add(new THREE.Mesh(createLobeGeometry(index), skinMaterial));
      }
      [
        [-0.3, -0.3, 0.12, 0.42, 0.07, 0.17],
        [0.34, -0.26, 0.13, 0.4, 0.065, 0.16],
      ].forEach((item, index) => {
        const [x, y, z, sx, sy, sz] = item;
        const slit = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 18), darkMaterial);
        slit.position.set(x, y, z);
        slit.scale.set(sx, sy, sz);
        slit.rotation.z = 0.1 - index * 0.12;
        object.add(slit);
        const lip = new THREE.Mesh(new THREE.TorusGeometry(sx * 0.9, 0.028, 12, 86), lipMaterial);
        lip.position.set(x, y - 0.015, z);
        lip.scale.set(1, 0.15, Math.max(0.25, sz / sx));
        lip.rotation.set(Math.PI / 2, 0.04 + index * 0.06, 0.1 - index * 0.12);
        object.add(lip);
      });

      const key = new THREE.DirectionalLight(0xff8985, 7.2);
      key.position.set(-3.0, -2.5, 4.8);
      scene.add(key);
      const rim = new THREE.PointLight(0x850d20, 6.4, 14);
      rim.position.set(2.7, 1.7, 2.6);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffbab4, 0x0b0104, 1.9));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 22 + pointer.x * 0.18;
        object.rotation.x = 0.66 + pointer.y * 0.07 + Math.sin(elapsed * 0.46) * 0.025;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createLobeGeometry(lobeIndex) {
        const uSegments = 116;
        const vSegments = 62;
        const positions = [];
        const colors = [];
        const indices = [];
        const color = new THREE.Color();
        for (let y = 0; y <= vSegments; y += 1) {
          const v = y / vSegments;
          const phi = -Math.PI / 2 + v * Math.PI;
          const dome = Math.max(0, Math.cos(phi));
          for (let x = 0; x < uSegments; x += 1) {
            const u = x / uSegments;
            const theta = u * Math.PI * 2;
            const seam = seamField(u, v, lobeIndex * 0.9);
            const squash = 1 - 0.18 * seam;
            let px = Math.cos(theta) * dome * 0.78 * squash * (1 + 0.06 * Math.sin(theta * 3 + lobeIndex * 0.9));
            let py = Math.sin(theta) * dome * 0.42 * squash * (1 + 0.08 * Math.cos(theta * 2 - lobeIndex * 0.9));
            let pz = Math.sin(phi) * 0.88 * (1 + 0.08 * Math.sin(theta * 2 + lobeIndex * 0.9));
            px += (lobeIndex - 1) * 0.55;
            py += 0.11 * Math.sin((lobeIndex + 1) * 0.8);
            pz += 0.08 * Math.sin(theta - 0.5) * dome;
            positions.push(px, py, pz);
            const wet = 0.5 + 0.5 * Math.sin(theta * 2.8 + v * Math.PI * 4 + lobeIndex);
            color.setRGB(0.63 + wet * 0.13 - seam * 0.34, 0.17 + wet * 0.06 - seam * 0.14, 0.27 + wet * 0.07 - seam * 0.2);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vSegments; y += 1) {
          for (let x = 0; x < uSegments; x += 1) {
            const a = y * uSegments + x;
            const b = y * uSegments + ((x + 1) % uSegments);
            const c = (y + 1) * uSegments + ((x + 1) % uSegments);
            const d = (y + 1) * uSegments + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function seamField(u, v, offset) {
        const theta = u * Math.PI * 2;
        let band = 0;
        for (let i = 0; i < 5; i += 1) {
          const center = 0.18 + i * 0.16 + 0.045 * Math.sin(theta * 1.4 + offset);
          const distance = Math.abs(v - center);
          band += Math.max(0, 1 - distance / 0.045) ** 2.3;
        }
        const pinch = Math.exp(-1 * (((Math.sin(theta - 0.4) + 1) / 0.34) ** 2 + ((v - 0.48) / 0.23) ** 2));
        const edge = smoothstep(0.72, 1, Math.abs(Math.cos(theta)));
        return Math.min(1, band * 0.5 + pinch * 0.85 + edge * 0.24);
      }

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
