<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inverted Membrane Cavity / Blender Generative Lab</title>
    <style>
      :root { color-scheme: dark; --bg:#070103; --ink:#f7eeee; --muted:#bfa4aa; --accent:#ff6874; }
      * { box-sizing: border-box; }
      html, body { width:100%; height:100%; }
      body {
        margin:0; overflow:hidden; color:var(--ink);
        background:radial-gradient(circle at 48% 48%, rgba(156,18,48,.28), transparent 34%),
          radial-gradient(circle at 50% 70%, rgba(48,2,16,.38), transparent 30%), var(--bg);
        font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
      canvas:active { cursor:grabbing; }
      .hud { position:fixed; inset:18px 18px auto; z-index:2; display:flex; justify-content:space-between; gap:18px; pointer-events:none; text-shadow:0 2px 18px rgba(0,0,0,.84); }
      h1 { margin:0; font-size:clamp(20px,3vw,42px); line-height:1; letter-spacing:0; text-transform:uppercase; }
      p { margin:8px 0 0; max-width:780px; color:var(--muted); font-size:clamp(12px,1.3vw,15px); line-height:1.55; }
      a { pointer-events:auto; align-self:flex-start; min-width:112px; padding:10px 13px; border:1px solid rgba(247,238,238,.28); background:rgba(7,1,3,.56); color:var(--ink); font-size:12px; line-height:1; text-align:center; text-decoration:none; backdrop-filter:blur(12px); }
      .meter { position:fixed; right:18px; bottom:18px; left:18px; z-index:2; height:2px; overflow:hidden; background:rgba(247,238,238,.12); }
      .meter span { display:block; width:100%; height:100%; transform-origin:left center; background:linear-gradient(90deg,#3c0512,var(--accent),#f7eeee); animation:loop-meter 24s linear infinite; }
      .version { position:fixed; left:18px; bottom:26px; z-index:2; color:var(--accent); font-size:11px; letter-spacing:0; text-transform:uppercase; pointer-events:none; text-shadow:0 2px 14px rgba(0,0,0,.82); }
      @keyframes loop-meter { from { transform:scaleX(0); } to { transform:scaleX(1); } }
      @media (max-width:720px) { .hud{display:block} a{display:inline-block;margin-top:12px} }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Inverted Membrane Cavity procedural preview"></canvas>
    <div class="hud"><div><h1>Inverted Membrane Cavity</h1><p>Organic Motion Objects / folded membrane abstraction / dark inward cavity, thick lip, no decorative vessels</p></div><a href="../days/2026-09-01.html">Daily report</a></div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.09.01</div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:"high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.42;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.024);
      const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 90);
      const object = new THREE.Group();
      object.rotation.x = 0.36;
      object.rotation.z = -0.18;
      scene.add(object);
      const controls = { rx:0.36, ry:0, trx:0.36, try:0, pan:new THREE.Vector2(), tpan:new THREE.Vector2(), dist:5.85, tdist:5.85, pointers:new Map(), lastCenter:null, lastDistance:0, dragMode:"rotate" };
      const skin = new THREE.MeshStandardMaterial({ color:0xc94a5b, emissive:0x26030c, emissiveIntensity:.12, roughness:.2, metalness:0, vertexColors:true });
      const dark = new THREE.MeshStandardMaterial({ color:0x070004, roughness:.54 });
      const lip = new THREE.MeshStandardMaterial({ color:0xad2338, emissive:0x260006, emissiveIntensity:.1, roughness:.17, metalness:0 });
      object.add(new THREE.Mesh(createMembraneGeometry(), skin));
      const voidMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 24), dark);
      voidMesh.position.set(0, -0.54, 0);
      voidMesh.scale.set(0.62, 0.16, 0.46);
      object.add(voidMesh);
      const lipMesh = new THREE.Mesh(new THREE.TorusGeometry(0.66, 0.09, 18, 128), lip);
      lipMesh.position.set(0, -0.48, 0);
      lipMesh.scale.set(1, .32, .72);
      lipMesh.rotation.x = Math.PI / 2;
      object.add(lipMesh);
      const key = new THREE.DirectionalLight(0xff8985, 7.4);
      key.position.set(-3, -2.5, 4.8);
      scene.add(key);
      const rim = new THREE.PointLight(0x850d20, 6.4, 14);
      rim.position.set(2.7, 1.7, 2.6);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffbab4, 0x0b0104, 1.9));
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());
      canvas.addEventListener("wheel", onWheel, { passive:false });
      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);
      function render() {
        const elapsed = performance.now() / 1000;
        controls.rx += (controls.trx - controls.rx) * .14;
        controls.ry += (controls.try - controls.ry) * .14;
        controls.pan.lerp(controls.tpan, .16);
        controls.dist += (controls.tdist - controls.dist) * .16;
        object.rotation.x = controls.rx + Math.sin(elapsed * .46) * .015;
        object.rotation.y = elapsed * Math.PI * 2 / 76 + controls.ry;
        camera.position.set(controls.pan.x - .08, controls.pan.y + .02, controls.dist);
        camera.lookAt(controls.pan.x, controls.pan.y - .03, 0);
        renderer.render(scene, camera);
      }
      function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
      function onWheel(event) { event.preventDefault(); controls.tdist = clamp(controls.tdist + event.deltaY * .0028, 3.2, 9); }
      function onPointerDown(event) { canvas.setPointerCapture(event.pointerId); controls.pointers.set(event.pointerId, point(event)); controls.dragMode = event.button === 2 || event.shiftKey ? "pan" : "rotate"; updateMemory(); }
      function onPointerMove(event) {
        if (!controls.pointers.has(event.pointerId)) return;
        const prev = controls.pointers.get(event.pointerId);
        const cur = point(event);
        controls.pointers.set(event.pointerId, cur);
        if (controls.pointers.size >= 2) { pinchPan(); return; }
        const dx = cur.x - prev.x, dy = cur.y - prev.y;
        if (controls.dragMode === "pan") panBy(dx, dy);
        else { controls.try += dx * .008; controls.trx = clamp(controls.trx + dy * .006, -.9, 1.55); }
      }
      function onPointerUp(event) { controls.pointers.delete(event.pointerId); try { canvas.releasePointerCapture(event.pointerId); } catch {} updateMemory(); }
      function point(event) { return { x:event.clientX, y:event.clientY }; }
      function updateMemory() { const p = [...controls.pointers.values()]; controls.lastCenter = p.length >= 2 ? center(p[0], p[1]) : null; controls.lastDistance = p.length >= 2 ? distance(p[0], p[1]) : 0; }
      function pinchPan() { const p = [...controls.pointers.values()]; const c = center(p[0], p[1]); const d = distance(p[0], p[1]); if (controls.lastCenter) panBy(c.x - controls.lastCenter.x, c.y - controls.lastCenter.y); if (controls.lastDistance > 0) controls.tdist = clamp(controls.tdist * (controls.lastDistance / Math.max(40, d)), 3.2, 9); controls.lastCenter = c; controls.lastDistance = d; }
      function panBy(dx, dy) { const scale = controls.tdist * .0015; controls.tpan.x = clamp(controls.tpan.x - dx * scale, -1.2, 1.2); controls.tpan.y = clamp(controls.tpan.y + dy * scale, -.8, .8); }
      function center(a, b) { return { x:(a.x + b.x) * .5, y:(a.y + b.y) * .5 }; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function createMembraneGeometry() {
        const uSegments = 136, vSegments = 74, positions = [], colors = [], indices = [], color = new THREE.Color();
        for (let y = 0; y <= vSegments; y += 1) {
          const v = y / vSegments, phi = -Math.PI / 2 + v * Math.PI, dome = Math.max(0, Math.cos(phi));
          for (let x = 0; x < uSegments; x += 1) {
            const u = x / uSegments, theta = u * Math.PI * 2, fold = foldField(u, v), mouth = Math.exp(-1 * (((v - .52) / .18) ** 2)), pinch = 1 - .42 * mouth;
            const rx = 1.12 * pinch * (1 + .1 * Math.sin(theta * 3 + .4)) + fold * .14;
            const ry = .82 * pinch * (1 + .08 * Math.cos(theta * 2 - .3)) + fold * .1;
            const rz = 1.02 * (1 + .08 * Math.sin(theta * 2));
            positions.push(Math.cos(theta) * dome * rx, Math.sin(theta) * dome * ry - mouth * .34, Math.sin(phi) * rz + .14 * Math.sin(theta - .9) * dome);
            const wet = .5 + .5 * Math.sin(theta * 3 + v * Math.PI * 4.2), crease = Math.min(.86, fold * .84);
            color.setRGB(.68 + wet * .15 - crease * .42, .19 + wet * .07 - crease * .16, .29 + wet * .07 - crease * .2);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vSegments; y += 1) for (let x = 0; x < uSegments; x += 1) {
          const a = y * uSegments + x, b = y * uSegments + ((x + 1) % uSegments), c = (y + 1) * uSegments + ((x + 1) % uSegments), d = (y + 1) * uSegments + x;
          indices.push(a, b, d, b, c, d);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }
      function foldField(u, v) {
        let pleats = 0;
        for (let i = 0; i < 10; i += 1) {
          const centerValue = (i / 10 + .18 * v + .025 * Math.sin(v * Math.PI * 4)) % 1;
          const distanceValue = Math.abs(((u - centerValue + .5) % 1) - .5);
          pleats += Math.max(0, 1 - distanceValue / .034) ** 2.1;
        }
        const collar = Math.exp(-1 * (((v - .52) / .16) ** 2));
        return Math.min(1, collar * .64 + pleats * .34);
      }
    </script>
  </body>
</html>
