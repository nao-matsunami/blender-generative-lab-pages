<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Splenic Pulp Lacuna / Blender Generative Lab</title>
    <style>
      :root { color-scheme:dark; --bg:#050102; --ink:#f8eeee; --muted:#caa0a4; --accent:#ff435a; }
      * { box-sizing:border-box; }
      html,body { width:100%; height:100%; }
      body { margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 48%, rgba(105,2,21,.36), transparent 32%), radial-gradient(circle at 50% 72%, rgba(22,1,7,.54), transparent 34%), var(--bg); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
      canvas:active { cursor:grabbing; }
      .hud { position:fixed; inset:18px 18px auto; z-index:2; display:flex; justify-content:space-between; gap:18px; pointer-events:none; text-shadow:0 2px 18px rgba(0,0,0,.84); }
      h1 { margin:0; font-size:clamp(20px,3vw,42px); line-height:1; letter-spacing:0; text-transform:uppercase; }
      p { margin:8px 0 0; max-width:820px; color:var(--muted); font-size:clamp(12px,1.3vw,15px); line-height:1.55; }
      a { pointer-events:auto; align-self:flex-start; min-width:112px; padding:10px 13px; border:1px solid rgba(248,238,238,.28); background:rgba(5,1,2,.58); color:var(--ink); font-size:12px; line-height:1; text-align:center; text-decoration:none; backdrop-filter:blur(12px); }
      .meter { position:fixed; right:18px; bottom:18px; left:18px; z-index:2; height:2px; overflow:hidden; background:rgba(248,238,238,.12); }
      .meter span { display:block; width:100%; height:100%; transform-origin:left center; background:linear-gradient(90deg,#290207,var(--accent),#f8eeee); animation:loop-meter 24s linear infinite; }
      .version { position:fixed; left:18px; bottom:26px; z-index:2; color:var(--accent); font-size:11px; letter-spacing:0; text-transform:uppercase; pointer-events:none; text-shadow:0 2px 14px rgba(0,0,0,.82); }
      @keyframes loop-meter { from { transform:scaleX(0); } to { transform:scaleX(1); } }
      @media (max-width:720px) { .hud{display:block} a{display:inline-block;margin-top:12px} }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Splenic Pulp Lacuna procedural preview"></canvas>
    <div class="hud"><div><h1>Splenic Pulp Lacuna</h1><p>Organic Motion Objects / splenic red-pulp abstraction / soft tissue, dark lacunae, compressed wet rims</p></div><a href="../days/2026-09-11.html">Daily report</a></div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.09.11</div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:"high-performance" });
      renderer.setClearColor(0x050102, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.45;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050102, .024);
      const camera = new THREE.PerspectiveCamera(39, 1, .1, 90);
      const object = new THREE.Group();
      object.rotation.x = .36;
      object.rotation.z = -.16;
      scene.add(object);
      const controls = { rx:.36, ry:0, trx:.36, try:0, pan:new THREE.Vector2(), tpan:new THREE.Vector2(), dist:5.55, tdist:5.55, pointers:new Map(), lastCenter:null, lastDistance:0, dragMode:"rotate" };
      const bodyMat = new THREE.MeshStandardMaterial({ color:0x961328, emissive:0x210004, emissiveIntensity:.08, roughness:.14, metalness:0, vertexColors:true });
      const lipMat = new THREE.MeshStandardMaterial({ color:0xa91428, emissive:0x250005, emissiveIntensity:.08, roughness:.15, metalness:0 });
      const darkMat = new THREE.MeshStandardMaterial({ color:0x040002, roughness:.72 });
      object.add(new THREE.Mesh(createBodyGeometry(), bodyMat));
      for (const [x, y, z, sx, sy, sz, rz] of [[-.52,-.64,-.16,.2,.08,.29,-.48],[-.25,-.72,.34,.18,.075,.23,-.16],[.16,-.76,-.02,.25,.09,.33,.1],[.48,-.67,.37,.17,.07,.24,.38],[.6,-.62,-.35,.19,.075,.27,.54]]) {
        const pit = new THREE.Mesh(new THREE.SphereGeometry(1, 46, 18), darkMat);
        pit.position.set(x, y, z);
        pit.scale.set(sx, sy, sz);
        object.add(pit);
        const lip = new THREE.Mesh(new THREE.SphereGeometry(1, 44, 16), lipMat);
        lip.position.set(x * .98, y + .03, z);
        lip.scale.set(sx * 1.36, .045, sz * 1.16);
        lip.rotation.z = rz;
        object.add(lip);
      }
      const key = new THREE.DirectionalLight(0xff626b, 7.8);
      key.position.set(-3, -2.7, 5);
      scene.add(key);
      const rim = new THREE.PointLight(0x820817, 6.8, 14);
      rim.position.set(2.6, 1.5, 2.9);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffaba8, 0x080103, 1.85));
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());
      canvas.addEventListener("wheel", onWheel, { passive:false });
      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);
      function render() { const elapsed = performance.now() / 1000; controls.rx += (controls.trx - controls.rx) * .14; controls.ry += (controls.try - controls.ry) * .14; controls.pan.lerp(controls.tpan, .16); controls.dist += (controls.tdist - controls.dist) * .16; object.rotation.x = controls.rx + Math.sin(elapsed * .5) * .014; object.rotation.y = elapsed * Math.PI * 2 / 90 + controls.ry; camera.position.set(controls.pan.x - .05, controls.pan.y, controls.dist); camera.lookAt(controls.pan.x, controls.pan.y - .03, 0); renderer.render(scene, camera); }
      function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
      function onWheel(event) { event.preventDefault(); controls.tdist = clamp(controls.tdist + event.deltaY * .0028, 3.2, 9); }
      function onPointerDown(event) { canvas.setPointerCapture(event.pointerId); controls.pointers.set(event.pointerId, point(event)); controls.dragMode = event.button === 2 || event.shiftKey ? "pan" : "rotate"; updateMemory(); }
      function onPointerMove(event) { if (!controls.pointers.has(event.pointerId)) return; const prev = controls.pointers.get(event.pointerId); const cur = point(event); controls.pointers.set(event.pointerId, cur); if (controls.pointers.size >= 2) { pinchPan(); return; } const dx = cur.x - prev.x, dy = cur.y - prev.y; if (controls.dragMode === "pan") panBy(dx, dy); else { controls.try += dx * .008; controls.trx = clamp(controls.trx + dy * .006, -.9, 1.55); } }
      function onPointerUp(event) { controls.pointers.delete(event.pointerId); try { canvas.releasePointerCapture(event.pointerId); } catch {} updateMemory(); }
      function point(event) { return { x:event.clientX, y:event.clientY }; }
      function updateMemory() { const p = [...controls.pointers.values()]; controls.lastCenter = p.length >= 2 ? center(p[0], p[1]) : null; controls.lastDistance = p.length >= 2 ? distance(p[0], p[1]) : 0; }
      function pinchPan() { const p = [...controls.pointers.values()]; const c = center(p[0], p[1]); const d = distance(p[0], p[1]); if (controls.lastCenter) panBy(c.x - controls.lastCenter.x, c.y - controls.lastCenter.y); if (controls.lastDistance > 0) controls.tdist = clamp(controls.tdist * (controls.lastDistance / Math.max(40, d)), 3.2, 9); controls.lastCenter = c; controls.lastDistance = d; }
      function panBy(dx, dy) { const scale = controls.tdist * .0015; controls.tpan.x = clamp(controls.tpan.x - dx * scale, -1.2, 1.2); controls.tpan.y = clamp(controls.tpan.y + dy * scale, -.8, .8); }
      function center(a, b) { return { x:(a.x + b.x) * .5, y:(a.y + b.y) * .5 }; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function pitAt(u, v) { let value = 0; for (const [cu, cv, w] of [[.1,.36,.95],[.23,.63,.8],[.43,.48,1.1],[.62,.66,.75],[.78,.39,.9]]) { const du = Math.abs(((u - cu + .5) % 1) - .5); const dv = v - cv; value += w * Math.exp(-((du / .065) ** 2 + (dv / .11) ** 2)); } return Math.min(1, value); }
      function ridgeAt(u, v) { let pulp = 0; for (let i = 0; i < 9; i += 1) { const center = i / 9 + .035 * Math.sin(v * Math.PI * 3.4); const d = Math.abs(((u - center + .5) % 1) - .5); pulp += Math.max(0, 1 - d / .07) ** 2.2; } return Math.min(1, pulp * .3 + pitAt(u, v) * .48 + (.5 + .5 * Math.sin(u * Math.PI * 4 - v * Math.PI * 2)) * .13); }
      function createBodyGeometry() {
        const uSeg = 122, vSeg = 66, positions = [], colors = [], indices = [], color = new THREE.Color();
        for (let y = 0; y <= vSeg; y += 1) {
          const v = y / vSeg, phi = -Math.PI / 2 + (.015 + v * .97) * Math.PI, dome = Math.max(0, Math.cos(phi));
          for (let x = 0; x < uSeg; x += 1) {
            const u = x / uSeg, theta = u * Math.PI * 2, pit = pitAt(u, v), ridge = ridgeAt(u, v);
            const rx = 1 * (1 + .11 * Math.sin(theta - .4)) + ridge * .108 - pit * .29, ry = .55 * (1 + .1 * Math.cos(phi * 1.2)) - pit * .35, rz = .92 * (1 + .12 * Math.cos(theta + .2));
            positions.push(Math.cos(theta) * dome * rx + .18 * Math.sin(phi * 1.2), Math.sin(theta) * dome * ry - pit * .29, Math.sin(phi) * rz + dome * Math.sin(theta * 2.8 + v * Math.PI * 2) * .07);
            const wet = .5 + .5 * Math.sin(theta * 3.1 + v * Math.PI * 3.6), crease = Math.min(.94, pit * .72 + ridge * .32);
            color.setRGB(.54 + wet * .14 - crease * .36, .04 + wet * .035 - crease * .036, .11 + wet * .055 - crease * .095);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vSeg; y += 1) for (let x = 0; x < uSeg; x += 1) { const a = y * uSeg + x, b = y * uSeg + ((x + 1) % uSeg), c = (y + 1) * uSeg + ((x + 1) % uSeg), d = (y + 1) * uSeg + x; indices.push(a, b, d, b, c, d); }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }
    </script>
  </body>
</html>
