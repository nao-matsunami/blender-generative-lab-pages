<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sixfold Reliquary Rotor / Blender Generative Lab</title>
    <style>
      :root { color-scheme:dark; --bg:#040303; --ink:#f0e8da; --muted:#b9ac99; --accent:#bd8b45; }
      * { box-sizing:border-box; }
      html,body { width:100%; height:100%; }
      body { margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 55%,rgba(70,28,19,.15),transparent 36%),var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      canvas { position:fixed; inset:0; display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
      canvas:active { cursor:grabbing; }
      .hud { position:fixed; inset:18px 18px auto; z-index:2; display:flex; justify-content:space-between; gap:18px; pointer-events:none; text-shadow:0 2px 18px #000; }
      h1 { margin:0; font-size:clamp(20px,3vw,42px); line-height:1; letter-spacing:0; text-transform:uppercase; }
      p { margin:8px 0 0; max-width:820px; color:var(--muted); font-size:clamp(12px,1.3vw,15px); line-height:1.55; }
      a { pointer-events:auto; align-self:flex-start; min-width:112px; padding:10px 13px; border:1px solid rgba(240,232,218,.28); background:rgba(4,3,3,.68); color:var(--ink); font-size:12px; line-height:1; text-align:center; text-decoration:none; backdrop-filter:blur(12px); }
      .version { position:fixed; left:18px; bottom:18px; z-index:2; color:var(--accent); font-size:11px; text-transform:uppercase; pointer-events:none; }
      .motion { position:fixed; right:18px; bottom:18px; z-index:2; color:#8d8171; font-size:10px; text-transform:uppercase; pointer-events:none; }
      @media (max-width:720px) { .hud{display:block} a{display:inline-block;margin-top:12px}.motion{display:none} }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Sixfold Reliquary Rotor interactive procedural preview"></canvas>
    <div class="hud"><div><h1>Sixfold Reliquary Rotor</h1><p>Organic Motion Objects / ritual instrument lane / six radial valves, counter-rotating races, weighted handles, and a biological cavity sealed inside</p></div><a href="../days/2026-09-30.html">Daily report</a></div>
    <div class="version">radial valve machine / 2026.09.30</div><div class="motion">drag rotate / wheel pinch zoom / shift drag pan</div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:"high-performance"});
      renderer.setClearColor(0x040303,1);
      renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.18;
      const scene=new THREE.Scene();
      scene.fog=new THREE.FogExp2(0x040303,.035);
      const camera=new THREE.PerspectiveCamera(36,1,.1,100);
      const assembly=new THREE.Group(); scene.add(assembly);
      const fixedFrame=new THREE.Group(), outerRotor=new THREE.Group(), innerRotor=new THREE.Group();
      assembly.add(fixedFrame,outerRotor,innerRotor);
      const controls={rx:.08,ry:-.08,trx:.08,try:-.08,pan:new THREE.Vector2(),tpan:new THREE.Vector2(),dist:7.3,tdist:7.3,pointers:new Map(),lastCenter:null,lastDistance:0,dragMode:"rotate"};

      const bone=new THREE.MeshPhysicalMaterial({color:0x9f8d6e,roughness:.56,metalness:0,clearcoat:.08});
      const soot=new THREE.MeshPhysicalMaterial({color:0x100b0c,roughness:.67,metalness:0,clearcoat:.05});
      const amber=new THREE.MeshPhysicalMaterial({color:0x6f3711,roughness:.39,metalness:0,emissive:0x160600,emissiveIntensity:.08});
      const bruised=new THREE.MeshPhysicalMaterial({color:0x610c25,roughness:.21,metalness:0,clearcoat:.42,clearcoatRoughness:.18});
      const cavityMat=new THREE.MeshPhysicalMaterial({color:0x110108,roughness:.12,metalness:0,clearcoat:.58,clearcoatRoughness:.12});

      const outerRace=new THREE.Mesh(new THREE.TorusGeometry(1.72,.19,24,144),soot); outerRace.position.z=-.03; outerRotor.add(outerRace);
      const innerRace=new THREE.Mesh(new THREE.TorusGeometry(1.22,.12,20,128),bone); innerRace.position.z=.04; outerRotor.add(innerRace);
      const cavity=new THREE.Mesh(new THREE.CylinderGeometry(.78,.86,.28,96,1,false),cavityMat); cavity.rotation.x=Math.PI/2; cavity.position.z=-.25; fixedFrame.add(cavity);
      const innerGlow=new THREE.PointLight(0x8e132d,3.5,5); innerGlow.position.set(0,0,.55); fixedFrame.add(innerGlow);

      for(let i=0;i<6;i++){
        const angle=i*Math.PI/3;
        const blade=new THREE.Mesh(makeBlade(.16,.34,2.18,1.30,.16),bone); blade.rotation.z=angle; blade.position.z=.08; outerRotor.add(blade);
        const petal=new THREE.Mesh(makeBlade(.08,.18,.78,.42,.09),bruised); petal.rotation.z=angle+.18; petal.position.z=.27; petal.userData.baseAngle=angle+.18; innerRotor.add(petal);
        const stud=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.24,40),amber); stud.rotation.x=Math.PI/2; stud.position.set(Math.cos(angle+Math.PI/6)*1.93,Math.sin(angle+Math.PI/6)*1.93,.04); outerRotor.add(stud);
      }

      fixedFrame.add(makeHandle(-1),makeHandle(1));
      const topLock=new THREE.Mesh(new THREE.BoxGeometry(.42,.28,.22,3,3,2),amber); topLock.position.set(0,2.15,.02); topLock.rotation.z=.12; fixedFrame.add(topLock);
      const bottomLock=topLock.clone(); bottomLock.position.y=-2.15; bottomLock.rotation.z=-.12; fixedFrame.add(bottomLock);

      scene.add(new THREE.HemisphereLight(0xffd1a0,0x080204,1.25));
      const key=new THREE.DirectionalLight(0xffa15c,6.2); key.position.set(-4,-4,6); scene.add(key);
      const rim=new THREE.PointLight(0xa31736,5.2,12); rim.position.set(3.2,2.4,3.5); scene.add(rim);

      canvas.addEventListener("contextmenu",event=>event.preventDefault());
      canvas.addEventListener("wheel",onWheel,{passive:false});
      canvas.addEventListener("pointerdown",onPointerDown);
      canvas.addEventListener("pointermove",onPointerMove);
      canvas.addEventListener("pointerup",onPointerUp);
      canvas.addEventListener("pointercancel",onPointerUp);
      addEventListener("resize",resize); resize(); renderer.setAnimationLoop(render);

      function makeBlade(innerHalf,outerHalf,length,start,depth){
        const shape=new THREE.Shape();
        shape.moveTo(start,-innerHalf); shape.lineTo(length,-outerHalf); shape.quadraticCurveTo(length+.15,0,length,outerHalf); shape.lineTo(start,innerHalf); shape.quadraticCurveTo(start-.12,0,start,-innerHalf);
        const geometry=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSegments:4,bevelSize:.045,bevelThickness:.035,curveSegments:12});
        geometry.translate(0,0,-depth*.5); geometry.computeVertexNormals(); return geometry;
      }
      function makeHandle(side){
        const x0=side*2.05,x1=side*3.05;
        const curve=new THREE.CubicBezierCurve3(new THREE.Vector3(x0,.88,0),new THREE.Vector3(x1,1.18,.02),new THREE.Vector3(x1,-1.18,.02),new THREE.Vector3(x0,-.88,0));
        const handle=new THREE.Mesh(new THREE.TubeGeometry(curve,72,.16,18,false),soot);
        const collarA=new THREE.Mesh(new THREE.TorusGeometry(.22,.08,16,48),amber); collarA.position.set(x0,.88,.01); collarA.scale.y=.72;
        const collarB=collarA.clone(); collarB.position.y=-.88;
        const group=new THREE.Group(); group.add(handle,collarA,collarB); return group;
      }
      function render(){
        const t=performance.now()/1000;
        controls.rx+=(controls.trx-controls.rx)*.14; controls.ry+=(controls.try-controls.ry)*.14; controls.pan.lerp(controls.tpan,.16); controls.dist+=(controls.tdist-controls.dist)*.16;
        assembly.rotation.x=controls.rx; assembly.rotation.y=controls.ry;
        outerRotor.rotation.z=t*.115; innerRotor.rotation.z=-t*.17;
        const pulse=.94+Math.sin(t*.92)*.045; innerRotor.scale.setScalar(pulse);
        camera.position.set(controls.pan.x,controls.pan.y,controls.dist); camera.lookAt(controls.pan.x,controls.pan.y,0); renderer.render(scene,camera);
      }
      function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
      function onWheel(event){event.preventDefault();controls.tdist=clamp(controls.tdist+event.deltaY*.0035,4.3,11);}
      function onPointerDown(event){canvas.setPointerCapture(event.pointerId);controls.pointers.set(event.pointerId,p2(event));controls.dragMode=event.button===2||event.shiftKey?"pan":"rotate";remember();}
      function onPointerMove(event){if(!controls.pointers.has(event.pointerId))return;const prev=controls.pointers.get(event.pointerId),cur=p2(event);controls.pointers.set(event.pointerId,cur);if(controls.pointers.size>=2){pinchPan();return;}const dx=cur.x-prev.x,dy=cur.y-prev.y;if(controls.dragMode==="pan")panBy(dx,dy);else{controls.try+=dx*.006;controls.trx=clamp(controls.trx+dy*.005,-.9,.9);}}
      function onPointerUp(event){controls.pointers.delete(event.pointerId);try{canvas.releasePointerCapture(event.pointerId);}catch{}remember();}
      function p2(event){return{x:event.clientX,y:event.clientY};}
      function remember(){const p=[...controls.pointers.values()];controls.lastCenter=p.length>=2?center(p[0],p[1]):null;controls.lastDistance=p.length>=2?distance(p[0],p[1]):0;}
      function pinchPan(){const p=[...controls.pointers.values()],c=center(p[0],p[1]),d=distance(p[0],p[1]);if(controls.lastCenter)panBy(c.x-controls.lastCenter.x,c.y-controls.lastCenter.y);if(controls.lastDistance>0)controls.tdist=clamp(controls.tdist*(controls.lastDistance/Math.max(40,d)),4.3,11);controls.lastCenter=c;controls.lastDistance=d;}
      function panBy(dx,dy){const scale=controls.tdist*.0015;controls.tpan.x=clamp(controls.tpan.x-dx*scale,-1.7,1.7);controls.tpan.y=clamp(controls.tpan.y+dy*scale,-1.1,1.1);}
      function center(a,b){return{x:(a.x+b.x)*.5,y:(a.y+b.y)*.5};} function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);} function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
    </script>
  </body>
</html>
