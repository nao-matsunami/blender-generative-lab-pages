<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valvular Chamber Bloom / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070103;
        --ink: #f7eeee;
        --muted: #bfa5aa;
        --accent: #ff6979;
        --deep: #7d0b23;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 52%, rgba(184, 26, 55, 0.2), transparent 35%),
          radial-gradient(circle at 45% 72%, rgba(54, 2, 17, 0.28), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.84);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 740px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(7, 1, 3, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #4d0515, var(--accent), #f7eeee);
        animation: loop-meter 18s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Valvular Chamber Bloom procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Valvular Chamber Bloom</h1>
        <p>Organic Motion Objects / heart-valve chamber abstraction / membrane petals, dark grooves, root vessels</p>
      </div>
      <a href="../days/2026-08-26.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.26</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.42;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.027);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.1, 7.2);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.46;
      object.rotation.z = 0.18;
      scene.add(object);
      object.add(createChamber());
      object.add(createValvePetals());
      object.add(createRootVessels());

      const key = new THREE.DirectionalLight(0xff7f86, 6.1);
      key.position.set(-3.2, -2.4, 4.8);
      scene.add(key);
      const rim = new THREE.PointLight(0x850c24, 6.2, 15);
      rim.position.set(3.0, 1.8, 2.8);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffbdb7, 0x0c0104, 1.75));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 18 + pointer.x * 0.16;
        object.rotation.x = 0.46 + pointer.y * 0.08 + Math.sin(elapsed * 0.5) * 0.025;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createChamber() {
        const positions = [];
        const colors = [];
        const indices = [];
        const uCount = 124;
        const vCount = 72;
        for (let y = 0; y <= vCount; y += 1) {
          const v = y / vCount;
          for (let x = 0; x < uCount; x += 1) {
            const u = x / uCount;
            const point = chamberPoint(u, v);
            positions.push(point.x, point.y, point.z);
            const color = colorAt(u, v);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vCount; y += 1) {
          for (let x = 0; x < uCount; x += 1) {
            const a = y * uCount + x;
            const b = y * uCount + ((x + 1) % uCount);
            const c = (y + 1) * uCount + ((x + 1) % uCount);
            const d = (y + 1) * uCount + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x23030c,
          emissiveIntensity: 0.13,
          roughness: 0.32,
          metalness: 0,
          side: THREE.DoubleSide,
        }));
      }

      function createRootVessels() {
        const group = new THREE.Group();
        const material = new THREE.MeshStandardMaterial({
          color: 0x2e0310,
          emissive: 0x120004,
          emissiveIntensity: 0.1,
          roughness: 0.28,
        });
        [
          [[0, -0.14, 1.05], [-0.46, -0.46, 1.62], [-0.8, -0.82, 1.82], 0.105],
          [[0, -0.1, 1.07], [0.42, -0.38, 1.6], [0.8, -0.74, 1.78], 0.096],
          [[-0.1, 0.04, 1.0], [-0.24, 0.54, 1.48], [-0.6, 0.88, 1.64], 0.08],
        ].forEach(([a, b, c, radius]) => {
          const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(...a), new THREE.Vector3(...b), new THREE.Vector3(...c)]);
          group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, radius, 14, false), material));
        });
        return group;
      }

      function createValvePetals() {
        const positions = [];
        const colors = [];
        const indices = [];
        const radialSteps = 16;
        const widthSteps = 9;
        for (let petal = 0; petal < 4; petal += 1) {
          const baseAngle = petal / 4 * Math.PI * 2 + 0.34;
          const start = positions.length / 3;
          for (let i = 0; i <= radialSteps; i += 1) {
            const r = i / radialSteps;
            for (let j = 0; j < widthSteps; j += 1) {
              const w = j / (widthSteps - 1) - 0.5;
              const angle = baseAngle + w * (0.58 - r * 0.22);
              const length = 0.2 + r * 0.72;
              const curl = Math.sin(r * Math.PI) * 0.15;
              positions.push(Math.cos(angle) * length, Math.sin(angle) * length * 0.78 - 0.1, 0.88 + r * 0.32 - curl);
              const edge = Math.abs(w) * 2;
              const dark = smoothstep(0, 0.7, r) * (1 - edge * 0.3);
              colors.push(0.9 - dark * 0.42, 0.28 - dark * 0.22, 0.31 - dark * 0.24);
            }
          }
          for (let i = 0; i < radialSteps; i += 1) {
            for (let j = 0; j < widthSteps - 1; j += 1) {
              const a = start + i * widthSteps + j;
              const b = start + i * widthSteps + j + 1;
              const c = start + (i + 1) * widthSteps + j + 1;
              const d = start + (i + 1) * widthSteps + j;
              indices.push(a, b, d, b, c, d);
            }
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          emissive: 0x1c0208,
          emissiveIntensity: 0.08,
          roughness: 0.34,
          metalness: 0,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.92,
        }));
      }

      function valveField(u, v) {
        const theta = u * Math.PI * 2;
        const ring = smoothstep(0.47, 0.58, v) * (1 - smoothstep(0.72, 0.88, v));
        const lobes = Math.max(0, Math.cos(theta * 4 - 0.45)) ** 4;
        const split = Math.max(0, Math.cos(theta * 8 + 0.2)) ** 2;
        return Math.min(1, ring * (lobes * 0.9 + split * 0.22));
      }

      function vesselGroove(u, v) {
        let field = 0;
        [[0.08, 0.08, 0.22, 0.68, 0.038, 1], [0.36, 0.12, -0.16, 0.76, 0.034, 0.8], [0.6, 0.18, 0.34, 0.62, 0.032, 0.85], [0.82, 0.1, -0.28, 0.7, 0.036, 0.72]].forEach(([u0, v0, drift, length, width, weight]) => {
          const center = (u0 + drift * (v - v0) + 0.055 * Math.sin(v * Math.PI * 2 * 1.6)) % 1;
          const along = smoothstep(v0, v0 + 0.16, v) * (1 - smoothstep(v0 + length * 0.72, v0 + length, v));
          const distance = Math.abs(((u - center + 0.5) % 1) - 0.5);
          field += Math.max(0, 1 - distance / width) ** 2 * along * weight;
        });
        return Math.min(1, field);
      }

      function chamberPoint(u, v) {
        const theta = u * Math.PI * 2;
        const phi = -Math.PI / 2 + v * Math.PI;
        const dome = Math.max(0, Math.cos(phi));
        const lower = 1 - smoothstep(0, 0.24, v);
        const upper = smoothstep(0.58, 0.96, v);
        const sideBulge = 1 + 0.2 * Math.sin(theta * 2 - 0.7) * dome ** 0.9;
        const cleft = 1 - 0.22 * Math.max(0, Math.cos(theta - 1.2)) ** 3 * smoothstep(0.18, 0.72, v);
        const valve = valveField(u, v);
        const groove = vesselGroove(u, v);
        const rx = 1.08 * sideBulge * cleft + valve * 0.25 - groove * 0.08;
        const ry = 0.86 * (1 + 0.16 * Math.sin(theta * 3 + 0.4) * dome) + valve * 0.14 - groove * 0.05;
        const rz = 1.25 * (1 - lower * 0.28 + upper * 0.1);
        return new THREE.Vector3(
          Math.cos(theta) * dome * rx + 0.2 * smoothstep(0.15, 0.72, v) * Math.sin(theta + 0.7),
          Math.sin(theta) * dome * ry,
          Math.sin(phi) * rz + valve * 0.15 - lower * 0.25
        );
      }

      function colorAt(u, v) {
        const theta = u * Math.PI * 2;
        const valve = valveField(u, v);
        const groove = vesselGroove(u, v);
        const wet = 0.5 + 0.5 * Math.sin(theta * 3 + v * Math.PI * 2 * 1.7);
        const base = { r: 0.68 + wet * 0.18, g: 0.17 + wet * 0.06, b: 0.24 + wet * 0.05 };
        const dark = { r: 0.08, g: 0.004, b: 0.025 };
        const valvePale = { r: 0.96, g: 0.42, b: 0.38 };
        const grooveDark = Math.min(0.88, groove * 0.74);
        const valveMix = valve * 0.34;
        const mixed = {
          r: base.r * (1 - valveMix) + valvePale.r * valveMix,
          g: base.g * (1 - valveMix) + valvePale.g * valveMix,
          b: base.b * (1 - valveMix) + valvePale.b * valveMix,
        };
        return {
          r: mixed.r * (1 - grooveDark) + dark.r * grooveDark,
          g: mixed.g * (1 - grooveDark) + dark.g * grooveDark,
          b: mixed.b * (1 - grooveDark) + dark.b * grooveDark,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
