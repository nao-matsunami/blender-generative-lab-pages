<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hepatic Vessel Bloom / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070103;
        --ink: #f7eeee;
        --muted: #bfa4a8;
        --accent: #ff6878;
        --deep: #7f0d25;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(180, 28, 58, 0.2), transparent 35%),
          radial-gradient(circle at 44% 70%, rgba(55, 2, 18, 0.28), transparent 31%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.84);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 740px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(7, 1, 3, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #4d0515, var(--accent), #f7eeee);
        animation: loop-meter 20s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Hepatic Vessel Bloom procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Hepatic Vessel Bloom</h1>
        <p>Organic Motion Objects / liver-like asymmetric organ mass / raised vessel-striation study</p>
      </div>
      <a href="../days/2026-08-25.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.25</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.38;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.027);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.12, 7.0);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.42;
      object.rotation.z = -0.2;
      scene.add(object);
      object.add(createHepaticBloom());

      const key = new THREE.DirectionalLight(0xff7d84, 6.0);
      key.position.set(-3.2, -2.4, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0x820c24, 5.8, 15);
      rim.position.set(3.0, 1.8, 2.8);
      scene.add(rim);

      scene.add(new THREE.HemisphereLight(0xffbab4, 0x0c0104, 1.8));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 20 + pointer.x * 0.16;
        object.rotation.x = 0.42 + pointer.y * 0.08 + Math.sin(elapsed * 0.45) * 0.025;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createHepaticBloom() {
        const positions = [];
        const colors = [];
        const indices = [];
        const uCount = 128;
        const vCount = 72;
        for (let y = 0; y <= vCount; y += 1) {
          const v = y / vCount;
          const phi = -Math.PI / 2 + v * Math.PI;
          const dome = Math.cos(phi);
          for (let x = 0; x < uCount; x += 1) {
            const u = x / uCount;
            const theta = u * Math.PI * 2;
            const radius = organRadius(u, v);
            const px = Math.cos(theta) * dome * radius.x + 0.22 * smoothstep(0.18, 0.74, v) * Math.sin(theta - 1.2);
            const py = Math.sin(theta) * dome * radius.y;
            const pz = Math.sin(phi) * radius.z + 0.13 * Math.sin(theta * 2 - 0.4) * dome ** 1.2;
            positions.push(px, py, pz);
            const color = colorAt(u, v);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vCount; y += 1) {
          for (let x = 0; x < uCount; x += 1) {
            const a = y * uCount + x;
            const b = y * uCount + ((x + 1) % uCount);
            const c = (y + 1) * uCount + ((x + 1) % uCount);
            const d = (y + 1) * uCount + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x23030c,
          emissiveIntensity: 0.13,
          roughness: 0.33,
          metalness: 0,
          side: THREE.DoubleSide,
        }));
      }

      function vesselField(u, v) {
        let field = 0;
        [[0.16, 0.24, 0.18, 0.74, 1], [0.38, 0.32, 0.56, 0.88, 0.72], [0.58, 0.22, 0.5, 0.76, 0.86], [0.78, 0.36, 0.3, 0.82, 0.65], [0.26, 0.58, 0.76, 0.7, 0.55]].forEach(([u0, v0, drift, length, weight]) => {
          const center = (u0 + drift * (v - v0) + 0.08 * Math.sin(v * Math.PI * 2 * 1.7)) % 1;
          const along = smoothstep(v0 - 0.08, v0 + length, v) * (1 - smoothstep(v0 + length * 0.72, v0 + length, v));
          const distance = Math.abs(((u - center + 0.5) % 1) - 0.5);
          const width = 0.032 + 0.018 * (1 - along);
          field += Math.max(0, 1 - distance / width) ** 1.7 * along * weight;
        });
        return Math.min(1, field);
      }

      function organRadius(u, v) {
        const theta = u * Math.PI * 2;
        const phi = -Math.PI / 2 + v * Math.PI;
        const dome = Math.cos(phi);
        const asym = 1 + 0.18 * Math.sin(theta * 2 + 0.4) * dome ** 0.8;
        const leftLobe = 1 + 0.28 * smoothstep(-0.95, -0.2, Math.cos(theta)) * smoothstep(0.08, 0.75, v);
        const notch = 1 - 0.22 * smoothstep(0.08, 0.55, Math.sin(theta + 0.7)) * smoothstep(0.18, 0.72, v);
        const vessel = vesselField(u, v);
        const wrinkle = 1 + 0.04 * Math.sin(theta * 9 + v * Math.PI * 2 * 2);
        return {
          x: 1.42 * asym * leftLobe * notch * wrinkle + vessel * 0.24 * dome ** 0.7,
          y: 0.98 * (1 + 0.14 * Math.sin(theta * 3 - 0.9) * dome) * notch + vessel * 0.15,
          z: 0.82 * (1 + 0.12 * Math.sin(theta * 2 + 1.4) * dome),
        };
      }

      function colorAt(u, v) {
        const vessel = vesselField(u, v);
        const theta = u * Math.PI * 2;
        const wet = 0.5 + 0.5 * Math.sin(theta * 3 + v * Math.PI * 2 * 2);
        const bruise = 0.5 + 0.5 * Math.sin(theta * 7 - v * Math.PI * 2 * 3);
        const base = { r: 0.66 + wet * 0.16, g: 0.16 + wet * 0.06, b: 0.23 + wet * 0.06 };
        const dark = { r: 0.11, g: 0.006, b: 0.035 };
        const vein = { r: 0.24, g: 0.008, b: 0.035 };
        const pale = { r: 0.98, g: 0.42, b: 0.38 };
        const vesselMix = Math.min(0.96, vessel * 1.08);
        const bruiseMix = Math.max(0, bruise - 0.68) / 0.32 * 0.2;
        const mixed = {
          r: base.r * (1 - bruiseMix) + dark.r * bruiseMix,
          g: base.g * (1 - bruiseMix) + dark.g * bruiseMix,
          b: base.b * (1 - bruiseMix) + dark.b * bruiseMix,
        };
        const color = {
          r: mixed.r * (1 - vesselMix) + vein.r * vesselMix,
          g: mixed.g * (1 - vesselMix) + vein.g * vesselMix,
          b: mixed.b * (1 - vesselMix) + vein.b * vesselMix,
        };
        const highlight = smoothstep(0.72, 1, Math.sin(theta - 0.8)) * smoothstep(0.18, 0.84, v) * 0.1;
        return {
          r: color.r * (1 - highlight) + pale.r * highlight,
          g: color.g * (1 - highlight) + pale.g * highlight,
          b: color.b * (1 - highlight) + pale.b * highlight,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
