<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pancreatic Membrane Slab / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070103;
        --ink: #f7eeee;
        --muted: #bea4a8;
        --accent: #ff6872;
        --deep: #640b1a;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 48% 48%, rgba(150, 18, 42, 0.28), transparent 34%),
          radial-gradient(circle at 52% 68%, rgba(50, 2, 14, 0.36), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.84);
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 780px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(7, 1, 3, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #3c0512, var(--accent), #f7eeee);
        animation: loop-meter 21s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Pancreatic Membrane Slab procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Pancreatic Membrane Slab</h1>
        <p>Organic Motion Objects / pancreatic-splenic abstraction / flattened mass, fused membrane folds, dark clefts</p>
      </div>
      <a href="../days/2026-08-30.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.30</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.42;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.022);

      const camera = new THREE.PerspectiveCamera(43, 1, 0.1, 90);
      camera.position.set(-0.1, 0.02, 6.45);
      camera.lookAt(-0.05, 0.0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.84;
      object.rotation.z = -0.24;
      scene.add(object);

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xd04d5d,
        emissive: 0x2a030b,
        emissiveIntensity: 0.12,
        roughness: 0.2,
        metalness: 0.0,
        vertexColors: true,
      });
      const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x070004, roughness: 0.52 });
      const lipMaterial = new THREE.MeshStandardMaterial({ color: 0xc73348, emissive: 0x270007, emissiveIntensity: 0.1, roughness: 0.17, metalness: 0.0 });

      object.add(new THREE.Mesh(createSlabGeometry(), skinMaterial));
      [
        [-0.42, -0.02, 0.14, 0.22, 0.06, 0.46],
        [0.14, 0.1, 0.22, 0.15, 0.05, 0.36],
        [0.72, -0.08, 0.14, 0.11, 0.04, 0.25],
      ].forEach((item, index) => {
        const [x, y, z, sx, sy, sz] = item;
        const cleft = new THREE.Mesh(new THREE.SphereGeometry(1, 44, 18), darkMaterial);
        cleft.position.set(x, y, z);
        cleft.scale.set(sx, sy, sz);
        cleft.rotation.z = 0.15 + index * 0.12;
        object.add(cleft);
        const lip = new THREE.Mesh(new THREE.TorusGeometry(sx * 0.78, 0.028, 12, 72), lipMaterial);
        lip.position.set(x, y - 0.01, z);
        lip.scale.set(1, 0.18, sz / Math.max(0.1, sx) * 0.68);
        lip.rotation.set(Math.PI / 2, 0, 0.15 + index * 0.12);
        object.add(lip);
      });

      const key = new THREE.DirectionalLight(0xff8a84, 7.2);
      key.position.set(-3.0, -2.6, 4.8);
      scene.add(key);
      const rim = new THREE.PointLight(0x850d20, 6.4, 14);
      rim.position.set(2.7, 1.7, 2.6);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffbab4, 0x0b0104, 1.95));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 21 + pointer.x * 0.18;
        object.rotation.x = 0.84 + pointer.y * 0.07 + Math.sin(elapsed * 0.48) * 0.025;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createSlabGeometry() {
        const xSegments = 132;
        const ySegments = 62;
        const positions = [];
        const colors = [];
        const indices = [];
        const color = new THREE.Color();
        [1, -1].forEach((side) => {
          const sideOffset = positions.length / 3;
          for (let y = 0; y <= ySegments; y += 1) {
            const s = -1 + 2 * y / ySegments;
            for (let x = 0; x <= xSegments; x += 1) {
              const t = -1 + 2 * x / xSegments;
              const width = slabWidth(t);
              const edge = Math.abs(s);
              const fold = foldField(t, s);
              const px = t * 1.72;
              const py = s * width;
              const centerCurve = 0.26 * Math.sin((t + 0.16) * Math.PI * 0.92);
              const thickness = 0.14 + 0.11 * (1 - edge) + fold * 0.11;
              const pz = centerCurve + side * thickness + 0.08 * Math.sin(t * Math.PI * 4) * (1 - edge);
              positions.push(px, py, pz);
              const wet = 0.5 + 0.5 * Math.sin(t * Math.PI * 5.5 + s * 3);
              color.setRGB(0.68 + wet * 0.15 - fold * 0.34, 0.22 + wet * 0.07 - fold * 0.15, 0.28 + wet * 0.07 - fold * 0.19);
              colors.push(color.r, color.g, color.b);
            }
          }
          for (let y = 0; y < ySegments; y += 1) {
            for (let x = 0; x < xSegments; x += 1) {
              const a = sideOffset + y * (xSegments + 1) + x;
              const b = a + 1;
              const c = a + xSegments + 2;
              const d = a + xSegments + 1;
              if (side > 0) indices.push(a, d, b, b, d, c);
              else indices.push(a, b, d, b, c, d);
            }
          }
        });
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function slabWidth(t) {
        const head = 1 + 0.72 * Math.exp(-1 * (((t + 0.72) / 0.28) ** 2));
        const tail = 1 - 0.36 * smoothstep(0.35, 0.95, t);
        const waist = 1 - 0.22 * Math.exp(-1 * (((t + 0.08) / 0.18) ** 2));
        return 0.52 * head * tail * waist;
      }

      function foldField(t, s) {
        let field = 0;
        for (let i = 0; i < 9; i += 1) {
          const center = -0.82 + i * 0.21 + 0.05 * Math.sin(s * Math.PI * 2);
          const distance = Math.abs(t - center);
          field += Math.max(0, 1 - distance / 0.055) ** 2.2;
        }
        const edgeGrip = Math.max(0, Math.abs(s) - 0.62) / 0.38;
        const cleft = Math.exp(-1 * (((t + 0.32) / 0.12) ** 2 + (s / 0.28) ** 2));
        return Math.min(1, field * 0.45 + edgeGrip * 0.48 + cleft * 0.78);
      }

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
