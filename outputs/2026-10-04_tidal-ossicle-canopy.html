<body>
  <script>if(location.protocol==="file:")location.replace("https://nao-matsunami.github.io/blender-generative-lab-pages/outputs/2026-10-04_tidal-ossicle-canopy.html");</script>
  <canvas id="stage" aria-label="Tidal Ossicle Canopy interactive Blender model"></canvas>
  <div class="hud"><div><h1>Tidal Ossicle Canopy</h1><p>Growth / marine lane. Salt-bleached structural fronds carry broad bruised membranes around a suspended dark seed pod.</p></div><a href="../days/2026-10-04.html">Daily report</a></div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from "three";import{GLTFLoader}from"three/addons/loaders/GLTFLoader.js";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
    const canvas=document.querySelector("#stage"),loading=document.querySelector("#loading"),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});renderer.setClearColor(0x020202);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,2000),controls=new OrbitControls(camera,canvas),clock=new THREE.Clock();let mixer=null;controls.enableDamping=true;controls.dampingFactor=.065;controls.autoRotate=true;controls.autoRotateSpeed=.34;scene.add(new THREE.HemisphereLight(0xffd7ae,0x070204,1.75));const key=new THREE.DirectionalLight(0xffa05c,5.7);key.position.set(-4,-5,7);scene.add(key);const rim=new THREE.DirectionalLight(0x8f1733,4);rim.position.set(5,2,-3);scene.add(rim);
    new GLTFLoader().load("../exports/glb/tidal-ossicle-canopy.glb",gltf=>{const root=gltf.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z);root.position.sub(center);camera.position.set(span*.72,-span*1.25,span*.46);controls.target.set(0,0,0);controls.minDistance=span*.55;controls.maxDistance=span*2.8;if(gltf.animations.length){mixer=new THREE.AnimationMixer(root);gltf.animations.forEach(clip=>mixer.clipAction(clip).play())}loading.classList.add("ready")},undefined,error=>{loading.textContent="Asset load failed";console.error(error)});
    canvas.addEventListener("pointerdown",()=>controls.autoRotate=false,{once:true});addEventListener("resize",resize);resize();renderer.setAnimationLoop(()=>{if(mixer)mixer.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera)});function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
  </script>
