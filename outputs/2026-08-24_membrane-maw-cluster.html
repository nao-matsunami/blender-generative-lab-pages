<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membrane Maw Cluster / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080204;
        --ink: #f6eeee;
        --muted: #b8a8a8;
        --accent: #ff7d86;
        --deep: #7b1529;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 92, 110, 0.16), transparent 34%),
          radial-gradient(circle at 44% 76%, rgba(123, 21, 41, 0.16), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.82);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 660px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(246, 238, 238, 0.28);
        background: rgba(8, 2, 4, 0.52);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--accent); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(246, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--deep), var(--accent), #f6eeee);
        animation: loop-meter 25s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Membrane Maw Cluster procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Membrane Maw Cluster</h1>
        <p>Organic Motion Objects / membrane maw sac / grotesque VJ and print-form study</p>
      </div>
      <a href="../days/2026-08-24.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.24</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x080204, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.32;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x080204, 0.025);
      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.12, 6.5);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.08;
      object.rotation.z = -0.18;
      scene.add(object);
      object.add(createMaw());

      const key = new THREE.DirectionalLight(0xff8d91, 5.8);
      key.position.set(-3, -2.5, 4.8);
      scene.add(key);
      const rim = new THREE.PointLight(0x9b1933, 5.2, 14);
      rim.position.set(2.7, 1.8, 2.7);
      scene.add(rim);
      const fill = new THREE.HemisphereLight(0xffc9c4, 0x130407, 1.8);
      scene.add(fill);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 25 + pointer.x * 0.14;
        object.rotation.x = 0.08 + pointer.y * 0.07 + Math.sin(elapsed * 0.44) * 0.03;
        object.position.y = Math.sin(elapsed * 0.5) * 0.035;
        renderer.render(scene, camera);
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function createMaw() {
        const uSegments = 160;
        const vSegments = 96;
        const positions = [];
        const colors = [];
        const indices = [];
        for (let y = 0; y <= vSegments; y += 1) {
          const v = y / vSegments;
          const profile = Math.sin(v * Math.PI);
          const twist = v * Math.PI * 2 * 0.26 + Math.sin(v * Math.PI) * 0.22;
          for (let x = 0; x < uSegments; x += 1) {
            const u = x / uSegments;
            const angle = u * Math.PI * 2 + twist;
            const radius = radiusAt(u, v);
            const pouch = Math.sin(u * Math.PI * 2 * 3 - v * Math.PI * 2 * 0.7) * 0.17 * profile ** 1.15;
            positions.push(
              Math.cos(angle) * (radius + pouch) * (0.92 + 0.08 * Math.sin(v * Math.PI * 2 * 2)),
              Math.sin(angle) * radius * (0.72 + 0.08 * Math.cos(v * Math.PI * 2 * 2.4)),
              (v - 0.5) * 2.72,
            );
            const c = colorAt(u, v);
            colors.push(c.r, c.g, c.b);
          }
        }
        for (let y = 0; y < vSegments; y += 1) {
          for (let x = 0; x < uSegments; x += 1) {
            const a = y * uSegments + x;
            const b = y * uSegments + ((x + 1) % uSegments);
            const c = (y + 1) * uSegments + ((x + 1) % uSegments);
            const d = (y + 1) * uSegments + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x2a0710,
          emissiveIntensity: 0.14,
          roughness: 0.38,
          metalness: 0,
          side: THREE.DoubleSide,
        }));
      }

      function radiusAt(u, v) {
        const profile = Math.sin(v * Math.PI);
        const throat = 1 - smoothstep(0, 0.28, v);
        const crown = 1 - smoothstep(0.72, 1, v);
        const folds = Math.sin(u * Math.PI * 2 * 9 + v * Math.PI * 2 * 1.6);
        const small = Math.sin(u * Math.PI * 2 * 17 - v * Math.PI * 2 * 2.2);
        const lobes = 1 + 0.34 * Math.sin(u * Math.PI * 2 * 5 + 0.45) * profile;
        const base = 0.36 + 1.0 * profile ** 0.58;
        const mouthPull = -0.46 * throat - 0.24 * (1 - crown);
        return (base + mouthPull + folds * 0.115 * profile + small * 0.036 * profile) * lobes;
      }

      function colorAt(u, v) {
        const fold = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 9 + v * Math.PI * 2 * 1.6);
        const vein = smoothstep(0.58, 0.95, 1 - fold);
        const wet = 0.5 + 0.5 * Math.sin(v * Math.PI * 2 * 2 + u * Math.PI * 2 * 3);
        const rim = smoothstep(0, 0.18, v) * (1 - smoothstep(0.76, 1, v));
        const base = { r: 0.74 + wet * 0.16, g: 0.24 + wet * 0.06, b: 0.31 + wet * 0.06 };
        const bruise = { r: 0.23, g: 0.04, b: 0.13 };
        const pale = { r: 0.98, g: 0.52, b: 0.45 };
        const mixed = {
          r: base.r * (1 - vein) + bruise.r * vein,
          g: base.g * (1 - vein) + bruise.g * vein,
          b: base.b * (1 - vein) + bruise.b * vein,
        };
        return {
          r: mixed.r * (1 - rim * 0.22) + pale.r * rim * 0.22,
          g: mixed.g * (1 - rim * 0.22) + pale.g * rim * 0.22,
          b: mixed.b * (1 - rim * 0.22) + pale.b * rim * 0.22,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
