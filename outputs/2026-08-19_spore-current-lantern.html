<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spore Current Lantern / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020606;
        --ink: #f5f1ea;
        --muted: #b4afa3;
        --accent: #ff9a63;
        --cool: #68e5ff;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 45%, rgba(255, 124, 76, 0.16), transparent 34%),
          radial-gradient(circle at 44% 76%, rgba(74, 214, 255, 0.11), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 650px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(245, 241, 234, 0.28);
        background: rgba(2, 6, 6, 0.48);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--cool); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(245, 241, 234, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--accent), var(--cool), #f5f1ea);
        animation: loop-meter 28s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--cool);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Spore Current Lantern procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Spore Current Lantern</h1>
        <p>Organic Motion Objects / spore pod current lantern / VJ loop and print-form study</p>
      </div>
      <a href="../days/2026-08-19.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.19</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x020606, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.34;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020606, 0.025);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.18, 7.8);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();

      const object = new THREE.Group();
      object.rotation.x = 0.02;
      object.rotation.z = -0.1;
      scene.add(object);

      const lantern = createLantern();
      object.add(lantern);

      const floor = new THREE.GridHelper(7.5, 42, 0x2e3638, 0x0b1112);
      floor.position.y = -2.25;
      floor.material.transparent = true;
      floor.material.opacity = 0.16;
      scene.add(floor);

      const key = new THREE.DirectionalLight(0xffb07a, 5.5);
      key.position.set(-3.3, -2.5, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0x68e5ff, 8.4, 16);
      rim.position.set(3.0, 2.1, 2.9);
      scene.add(rim);

      const fill = new THREE.HemisphereLight(0xffeed6, 0x101c1f, 2.1);
      scene.add(fill);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 7; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 28 + pointer.x * 0.14;
        object.rotation.x = 0.02 + pointer.y * 0.06 + Math.sin(elapsed * 0.42) * 0.02;
        object.position.y = Math.sin(elapsed * 0.48) * 0.035;
        renderer.render(scene, camera);
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function createLantern() {
        const radial = 192;
        const vertical = 132;
        const positions = [];
        const colors = [];
        const indices = [];
        for (let y = 0; y <= vertical; y += 1) {
          const v = y / vertical;
          for (let x = 0; x < radial; x += 1) {
            const u = x / radial;
            const sample = lanternPoint(u, v);
            positions.push(sample.x, sample.y, sample.z);
            const color = lanternColor(u, v);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vertical; y += 1) {
          for (let x = 0; x < radial; x += 1) {
            const a = y * radial + x;
            const b = y * radial + ((x + 1) % radial);
            const c = (y + 1) * radial + ((x + 1) % radial);
            const d = (y + 1) * radial + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x1e0b06,
          emissiveIntensity: 0.15,
          roughness: 0.43,
          metalness: 0.0,
          side: THREE.DoubleSide,
        }));
      }

      function lanternPoint(u, v) {
        const profile = Math.sin(v * Math.PI);
        const twist = v * Math.PI * 2 * 0.38 + Math.sin(v * Math.PI) * 0.28;
        const angle = u * Math.PI * 2 + twist;
        const radius = lanternRadius(u, v);
        const ovalX = 0.96 + 0.08 * Math.sin(v * Math.PI * 2 * 2);
        const ovalY = 0.76 + 0.06 * Math.cos(v * Math.PI * 2 * 2.6);
        const pulse = Math.sin(u * Math.PI * 2 * 3 - v * Math.PI * 2 * 0.9) * 0.18 * profile ** 1.16;
        return {
          x: Math.cos(angle) * (radius + pulse) * ovalX,
          y: (v - 0.5) * 4.25,
          z: Math.sin(angle) * radius * ovalY,
        };
      }

      function lanternRadius(u, v) {
        const profile = Math.sin(v * Math.PI);
        const base = 0.42 + 1.1 * profile ** 0.66;
        const neck = -0.36 * Math.exp(-(((v - 0.94) / 0.075) ** 2));
        const foot = -0.26 * Math.exp(-(((v - 0.055) / 0.07) ** 2));
        let current = Math.sin(u * Math.PI * 2 * 7 + v * Math.PI * 2 * 2.1);
        current += 0.45 * Math.sin(u * Math.PI * 2 * 11 - v * Math.PI * 2 * 1.4);
        const rib = Math.sign(current) * Math.abs(current) ** 1.55 * 0.16 * profile;
        const chamber = Math.sin(u * Math.PI * 2 * 5 - v * Math.PI * 2 * 1.15) * 0.12 * profile ** 1.28;
        const asymmetry = Math.sin(u * Math.PI * 2 * 2 + v * Math.PI * 2 * 0.55) * 0.09 * profile;
        return base + neck + foot + rib + chamber + asymmetry;
      }

      function lanternColor(u, v) {
        const profile = Math.sin(v * Math.PI);
        const current = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 7 + v * Math.PI * 2 * 2.1);
        const groove = 1 - current;
        const flowLine = smoothstep(0.66, 0.96, groove) * profile;
        const warm = 0.82 + 0.2 * current + 0.12 * profile;
        const base = {
          r: Math.min(1, 0.86 * warm + 0.1),
          g: Math.min(1, 0.42 * warm + 0.2),
          b: Math.min(1, 0.22 * warm + 0.16),
        };
        const line = { r: 0.2, g: 0.36, b: 0.46 };
        return {
          r: base.r * (1 - flowLine) + line.r * flowLine,
          g: base.g * (1 - flowLine) + line.g * flowLine,
          b: base.b * (1 - flowLine) + line.b * flowLine,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
