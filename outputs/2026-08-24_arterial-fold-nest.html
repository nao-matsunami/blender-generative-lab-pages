<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arterial Fold Nest / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080104;
        --ink: #f7eeee;
        --muted: #bea5a8;
        --accent: #ff6f82;
        --deep: #8f1730;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 50%, rgba(183, 38, 70, 0.2), transparent 34%),
          radial-gradient(circle at 46% 76%, rgba(80, 8, 26, 0.2), transparent 28%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.82);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 700px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(8, 1, 4, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #4f081a, var(--accent), #f7eeee);
        animation: loop-meter 19s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Arterial Fold Nest procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Arterial Fold Nest</h1>
        <p>Organic Motion Objects / arterial membrane fold nest / red grotesque VJ and print-form study</p>
      </div>
      <a href="../days/2026-08-24.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.24</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x080104, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.36;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x080104, 0.026);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.16, 7.0);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.56;
      object.rotation.z = 0.16;
      scene.add(object);
      object.add(createFoldNest());

      const key = new THREE.DirectionalLight(0xff8790, 5.8);
      key.position.set(-3.2, -2.4, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0x8f1730, 6.1, 15);
      rim.position.set(3.0, 1.8, 2.8);
      scene.add(rim);

      scene.add(new THREE.HemisphereLight(0xffc0c0, 0x120207, 1.8));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 7; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 19 + pointer.x * 0.15;
        object.rotation.x = 0.56 + pointer.y * 0.08 + Math.sin(elapsed * 0.5) * 0.035;
        object.scale.y = 1 + Math.sin(elapsed * 0.78) * 0.018;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createFoldNest() {
        const positions = [];
        const colors = [];
        const indices = [];
        const uCount = 128;
        const vCount = 70;
        for (let y = 0; y <= vCount; y += 1) {
          const v = y / vCount;
          const profile = Math.sin(v * Math.PI);
          const z = (v - 0.5) * 3.28;
          const twist = v * Math.PI * 2 * 0.18 + Math.sin(v * Math.PI * 1.2) * 0.38;
          const pinch = 1 - 0.16 * Math.cos(v * Math.PI * 2);
          for (let x = 0; x < uCount; x += 1) {
            const u = x / uCount;
            const angle = u * Math.PI * 2 + twist;
            const artery = arterialField(u, v);
            const radius = radiusAt(u, v);
            const sag = Math.sin(u * Math.PI * 2 * 2 + v * Math.PI * 2 * 0.35) * 0.115 * profile ** 1.2;
            positions.push(
              Math.cos(angle) * (radius + sag) * (0.9 + 0.08 * artery),
              Math.sin(angle) * radius * (0.9 + 0.04 * Math.sin(v * Math.PI * 2 * 2)) * pinch,
              z
            );
            const color = colorAt(u, v);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vCount; y += 1) {
          for (let x = 0; x < uCount; x += 1) {
            const a = y * uCount + x;
            const b = y * uCount + ((x + 1) % uCount);
            const c = (y + 1) * uCount + ((x + 1) % uCount);
            const d = (y + 1) * uCount + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x280510,
          emissiveIntensity: 0.13,
          roughness: 0.35,
          metalness: 0,
          side: THREE.DoubleSide,
        }));
      }

      function arterialField(u, v) {
        let field = 0;
        [[0.08, 0.15, 1], [0.27, 0.61, 0.7], [0.48, 0.36, 0.82], [0.72, 0.83, 0.9]].forEach(([offset, phase, weight]) => {
          const center = (offset + 0.16 * Math.sin(v * Math.PI * 2 * 0.72 + phase)) % 1;
          const distance = Math.abs(((u - center + 0.5) % 1) - 0.5);
          field += Math.max(0, 1 - distance / 0.055) ** 2.2 * weight;
        });
        return Math.min(1, field);
      }

      function radiusAt(u, v) {
        const profile = Math.sin(v * Math.PI);
        const waist = 1 - 0.18 * Math.sin(v * Math.PI * 2 + 0.5);
        const lobes = 1 + 0.16 * Math.sin(u * Math.PI * 2 * 4 + v * Math.PI * 2 * 0.7);
        const folds = 1 + 0.095 * Math.sin(u * Math.PI * 2 * 12 - v * Math.PI * 2 * 2.5);
        const artery = arterialField(u, v);
        const mouth = smoothstep(0, 0.18, v) * (1 - smoothstep(0.84, 1, v));
        return (0.34 + 0.98 * profile ** 0.62) * waist * lobes * folds * (0.78 + mouth * 0.22) + artery * 0.26 * profile ** 0.95;
      }

      function colorAt(u, v) {
        const artery = arterialField(u, v);
        const foldShadow = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 12 - v * Math.PI * 2 * 2.5);
        const wet = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 3 + v * Math.PI * 2 * 1.8);
        const base = { r: 0.76 + wet * 0.16, g: 0.22 + wet * 0.06, b: 0.29 + wet * 0.05 };
        const dark = { r: 0.2, g: 0.022, b: 0.065 };
        const pale = { r: 1.0, g: 0.52, b: 0.46 };
        const shade = smoothstep(0.56, 1, 1 - foldShadow);
        const blush = smoothstep(0, 0.22, v) * (1 - smoothstep(0.78, 1, v));
        const mixDark = Math.min(0.82, artery * 0.68 + shade * 0.28);
        const mixed = {
          r: base.r * (1 - mixDark) + dark.r * mixDark,
          g: base.g * (1 - mixDark) + dark.g * mixDark,
          b: base.b * (1 - mixDark) + dark.b * mixDark,
        };
        return {
          r: mixed.r * (1 - blush * 0.18) + pale.r * blush * 0.18,
          g: mixed.g * (1 - blush * 0.18) + pale.g * blush * 0.18,
          b: mixed.b * (1 - blush * 0.18) + pale.b * blush * 0.18,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
