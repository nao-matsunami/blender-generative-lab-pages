<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neural Gut Bloom / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070206;
        --ink: #f5eeee;
        --muted: #baa9ad;
        --accent: #ff7894;
        --cool: #b73754;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 85, 130, 0.16), transparent 34%),
          radial-gradient(circle at 43% 74%, rgba(137, 24, 58, 0.13), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
      }
      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 660px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(245, 238, 238, 0.28);
        background: rgba(7, 2, 6, 0.52);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--cool); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(245, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #5b1024, var(--accent), #f5eeee);
        animation: loop-meter 21s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--cool);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Neural Gut Bloom procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Neural Gut Bloom</h1>
        <p>Organic Motion Objects / neural gut colony / grotesque VJ and print-form study</p>
      </div>
      <a href="../days/2026-08-23.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.23</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070206, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.34;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070206, 0.027);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);
      camera.position.set(0, 0.2, 7.2);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();

      const object = new THREE.Group();
      object.rotation.x = 0.68;
      object.rotation.z = -0.12;
      scene.add(object);
      object.add(createNeuralBloom());

      const key = new THREE.DirectionalLight(0xff8aa2, 5.6);
      key.position.set(-3.0, -2.4, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0xb73754, 5.8, 15);
      rim.position.set(2.9, 1.8, 2.8);
      scene.add(rim);

      const fill = new THREE.HemisphereLight(0xffc3d0, 0x10060c, 1.9);
      scene.add(fill);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 21 + pointer.x * 0.16;
        object.rotation.x = 0.68 + pointer.y * 0.08 + Math.sin(elapsed * 0.48) * 0.035;
        object.position.y = Math.sin(elapsed * 0.5) * 0.035;
        renderer.render(scene, camera);
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function createNeuralBloom() {
        const positions = [];
        const colors = [];
        const indices = [];
        appendCore(positions, colors, indices);
        for (let layer = 0; layer < 5; layer += 1) appendTendril(positions, colors, indices, layer);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          vertexColors: true,
          color: 0xffffff,
          emissive: 0x300914,
          emissiveIntensity: 0.16,
          roughness: 0.36,
          metalness: 0.0,
          side: THREE.DoubleSide,
        }));
      }

      function appendCore(positions, colors, indices) {
        const start = positions.length / 3;
        const uCount = 96;
        const vCount = 48;
        for (let y = 0; y <= vCount; y += 1) {
          const v = y / vCount;
          const phi = -Math.PI / 2 + v * Math.PI;
          for (let x = 0; x < uCount; x += 1) {
            const u = x / uCount;
            const theta = u * Math.PI * 2;
            const lobe = 1 + 0.12 * Math.sin(theta * 5 + phi * 1.3) + 0.09 * Math.sin(theta * 9 - phi * 2);
            const rib = 1 + 0.08 * Math.sin(theta * 14 + v * Math.PI * 2 * 1.8);
            const rx = 0.82 * lobe * rib;
            const ry = 0.68 * lobe;
            const rz = 0.58 * (1 + 0.08 * Math.sin(theta * 4));
            positions.push(Math.cos(phi) * Math.cos(theta) * rx, Math.cos(phi) * Math.sin(theta) * ry, Math.sin(phi) * rz);
            const c = colorAt(u, v, 0.2);
            colors.push(c.r, c.g, c.b);
          }
        }
        for (let y = 0; y < vCount; y += 1) {
          for (let x = 0; x < uCount; x += 1) {
            const a = start + y * uCount + x;
            const b = start + y * uCount + ((x + 1) % uCount);
            const c = start + (y + 1) * uCount + ((x + 1) % uCount);
            const d = start + (y + 1) * uCount + x;
            indices.push(a, b, d, b, c, d);
          }
        }
      }

      function appendTendril(positions, colors, indices, layer) {
        const start = positions.length / 3;
        const pathSegments = 168;
        const tubeSegments = 30;
        for (let i = 0; i < pathSegments; i += 1) {
          const u = i / pathSegments;
          const center = tendrilCenter(layer, u);
          const prev = tendrilCenter(layer, (u - 1 / pathSegments + 1) % 1);
          const next = tendrilCenter(layer, (u + 1 / pathSegments) % 1);
          const tangent = next.clone().sub(prev).normalize();
          let normal = tangent.clone().cross(new THREE.Vector3(0, 0, 1)).normalize();
          if (normal.length() < 0.001) normal = new THREE.Vector3(1, 0, 0);
          const binormal = normal.clone().cross(tangent).normalize();
          const twist = Math.sin(u * Math.PI * 2 * (2 + layer * 0.2)) * 0.48 + u * Math.PI * 2;
          for (let j = 0; j < tubeSegments; j += 1) {
            const v = j / tubeSegments;
            const angle = v * Math.PI * 2 + twist;
            const fold = Math.sin(u * Math.PI * 2 * (8 + layer) + v * Math.PI * 2 * 2);
            let radius = 0.145 + Math.sign(fold) * Math.abs(fold) ** 1.6 * 0.034;
            radius += Math.sin(u * Math.PI * 2 * 5 - layer) * 0.022;
            const oval = 1 + 0.22 * Math.max(0, Math.sin(angle + layer)) ** 1.7;
            const cross = normal.clone().multiplyScalar(Math.cos(angle) * radius * oval)
              .add(binormal.clone().multiplyScalar(Math.sin(angle) * radius * 0.86));
            const p = center.clone().add(cross);
            positions.push(p.x, p.y, p.z);
            const c = colorAt(u, v, 0.45 + layer * 0.08);
            colors.push(c.r, c.g, c.b);
          }
        }
        for (let i = 0; i < pathSegments; i += 1) {
          for (let j = 0; j < tubeSegments; j += 1) {
            const a = start + i * tubeSegments + j;
            const b = start + i * tubeSegments + ((j + 1) % tubeSegments);
            const c = start + ((i + 1) % pathSegments) * tubeSegments + ((j + 1) % tubeSegments);
            const d = start + ((i + 1) % pathSegments) * tubeSegments + j;
            indices.push(a, b, d, b, c, d);
          }
        }
      }

      function tendrilCenter(layer, t) {
        const angle = t * Math.PI * 2;
        const phase = layer * 0.92;
        const orbit = 1.02 + 0.18 * Math.sin(angle * 3 + phase);
        return new THREE.Vector3(
          Math.cos(angle + phase * 0.16) * orbit + Math.sin(angle * 4 + phase) * 0.2,
          Math.sin(angle + phase * 0.16) * orbit * 0.74 + Math.cos(angle * 3 - phase) * 0.17,
          0.44 * Math.sin(angle * 2 + phase) + 0.22 * Math.sin(angle * 5 - phase),
        );
      }

      function colorAt(u, v, layer) {
        const vein = smoothstep(0.62, 0.98, 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 12 + v * Math.PI * 2 * 1.7));
        const wet = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 5 - layer * 0.8);
        const base = { r: 0.74 + wet * 0.16, g: 0.22 + layer * 0.055, b: 0.31 + wet * 0.08 };
        const nerve = { r: 0.28, g: 0.055, b: 0.16 };
        return {
          r: base.r * (1 - vein) + nerve.r * vein,
          g: base.g * (1 - vein) + nerve.g * vein,
          b: base.b * (1 - vein) + nerve.b * vein,
        };
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
