<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gastric Rugae Maw / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070103;
        --ink: #f7eeee;
        --muted: #bea4a8;
        --accent: #ff6974;
        --deep: #650c1c;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 45% 50%, rgba(150, 18, 42, 0.27), transparent 34%),
          radial-gradient(circle at 34% 66%, rgba(50, 2, 14, 0.36), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.84);
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        max-width: 760px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }
      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(247, 238, 238, 0.28);
        background: rgba(7, 1, 3, 0.56);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }
      a:hover { border-color: var(--deep); }
      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(247, 238, 238, 0.12);
      }
      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #3c0512, var(--accent), #f7eeee);
        animation: loop-meter 19s linear infinite;
      }
      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }
      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Gastric Rugae Maw procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Gastric Rugae Maw</h1>
        <p>Organic Motion Objects / stomach-rugae abstraction / compressed folds, dark cavity, no decorative vessels</p>
      </div>
      <a href="../days/2026-08-29.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.29</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x070103, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.42;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070103, 0.024);

      const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 90);
      camera.position.set(-0.32, 0.02, 5.65);
      camera.lookAt(-0.08, 0.02, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();
      const object = new THREE.Group();
      object.rotation.x = 0.16;
      object.rotation.z = -0.26;
      scene.add(object);

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xd35060,
        emissive: 0x2a030b,
        emissiveIntensity: 0.12,
        roughness: 0.2,
        metalness: 0.0,
        vertexColors: true,
      });
      const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x070004, roughness: 0.5 });
      const lipMaterial = new THREE.MeshStandardMaterial({ color: 0xc73348, emissive: 0x270007, emissiveIntensity: 0.1, roughness: 0.17, metalness: 0.0 });

      const body = new THREE.Mesh(createBodyGeometry(), skinMaterial);
      object.add(body);

      const maw = new THREE.Mesh(new THREE.SphereGeometry(1, 56, 22), darkMaterial);
      maw.position.set(-0.78, -0.18, 0.12);
      maw.scale.set(0.2, 0.08, 0.46);
      object.add(maw);

      const lip = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.055, 16, 96), lipMaterial);
      lip.position.set(-0.76, -0.2, 0.12);
      lip.scale.set(0.88, 0.24, 1.34);
      lip.rotation.set(Math.PI / 2, -0.1, -0.08);
      object.add(lip);

      const key = new THREE.DirectionalLight(0xff8c84, 7.2);
      key.position.set(-3.0, -2.5, 4.7);
      scene.add(key);
      const rim = new THREE.PointLight(0x850d20, 6.2, 14);
      rim.position.set(2.6, 1.7, 2.5);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xffbbb4, 0x0b0104, 1.95));

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });
      window.addEventListener("click", () => { object.rotation.y += Math.PI / 6; });
      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = elapsed * Math.PI * 2 / 19 + pointer.x * 0.18;
        object.rotation.x = 0.16 + pointer.y * 0.07 + Math.sin(elapsed * 0.52) * 0.025;
        renderer.render(scene, camera);
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function createBodyGeometry() {
        const uSegments = 136;
        const vSegments = 78;
        const positions = [];
        const colors = [];
        const indices = [];
        const color = new THREE.Color();
        for (let y = 0; y <= vSegments; y += 1) {
          const v = y / vSegments;
          const phi = -Math.PI / 2 + v * Math.PI;
          const dome = Math.max(0, Math.cos(phi));
          for (let x = 0; x < uSegments; x += 1) {
            const u = x / uSegments;
            const theta = u * Math.PI * 2;
            const fold = foldField(u, v);
            const constrict = 1 - 0.34 * Math.exp(-1 * (((Math.sin(theta + 0.8) + 1) / 0.42) ** 2 + ((v - 0.52) / 0.34) ** 2));
            const rx = 0.9 * (1 + 0.18 * Math.sin(theta - 0.7) * smoothstep(0.18, 0.82, v)) * constrict + fold * 0.18;
            const ry = 0.63 * (1 + 0.1 * Math.sin(theta * 2 + 0.3)) * constrict + fold * 0.14;
            const rz = 1.48 * (1 + 0.06 * Math.sin(theta * 3 - 0.4));
            positions.push(Math.cos(theta) * dome * rx, Math.sin(theta) * dome * ry, Math.sin(phi) * rz + 0.16 * Math.sin(theta - 1) * dome);
            const wet = 0.5 + 0.5 * Math.sin(theta * 3 + v * Math.PI * 4.4);
            color.setRGB(0.68 + wet * 0.16 - fold * 0.38, 0.22 + wet * 0.07 - fold * 0.16, 0.28 + wet * 0.08 - fold * 0.22);
            colors.push(color.r, color.g, color.b);
          }
        }
        for (let y = 0; y < vSegments; y += 1) {
          for (let x = 0; x < uSegments; x += 1) {
            const a = y * uSegments + x;
            const b = y * uSegments + ((x + 1) % uSegments);
            const c = (y + 1) * uSegments + ((x + 1) % uSegments);
            const d = (y + 1) * uSegments + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function foldField(u, v) {
        const theta = u * Math.PI * 2;
        const body = smoothstep(0.12, 0.32, v) * (1 - smoothstep(0.74, 0.93, v));
        let diagonal = 0;
        for (let i = 0; i < 8; i += 1) {
          const center = (0.08 + i * 0.118 + 0.26 * v + 0.035 * Math.sin(v * Math.PI * 4)) % 1;
          const distance = Math.abs(((u - center + 0.5) % 1) - 0.5);
          diagonal += Math.max(0, 1 - distance / 0.05) ** 2.4;
        }
        const collar = Math.max(0, 1 - Math.abs(v - 0.18) / 0.08) ** 2;
        const lower = Math.max(0, 1 - Math.abs(v - 0.77) / 0.075) ** 2;
        const pinched = Math.exp(-1 * (((Math.sin(theta + 0.8) + 1) / 0.36) ** 2 + ((v - 0.5) / 0.32) ** 2));
        return Math.min(1, diagonal * body * 0.78 + collar * 0.78 + lower * 0.55 + pinched * 0.9);
      }

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }
    </script>
  </body>
</html>
