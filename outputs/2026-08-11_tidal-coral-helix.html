<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidal Coral Helix / Blender Generative Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030607;
        --ink: #f6f1e9;
        --muted: #aeb2aa;
        --coral: #ff6f82;
        --cyan: #7deaff;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 44%, rgba(255, 92, 116, 0.28), transparent 34%),
          radial-gradient(circle at 46% 76%, rgba(64, 218, 255, 0.22), transparent 32%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }

      .hud {
        position: fixed;
        inset: 18px 18px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      }

      h1 {
        margin: 0;
        font-size: clamp(19px, 3vw, 42px);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 8px 0 0;
        max-width: 620px;
        color: var(--muted);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 1.55;
      }

      a {
        pointer-events: auto;
        align-self: flex-start;
        min-width: 112px;
        padding: 10px 13px;
        border: 1px solid rgba(246, 241, 233, 0.28);
        background: rgba(3, 6, 7, 0.46);
        color: var(--ink);
        font-size: 12px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      a:hover { border-color: var(--cyan); }

      .meter {
        position: fixed;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 2;
        height: 2px;
        overflow: hidden;
        background: rgba(246, 241, 233, 0.12);
      }

      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--coral), var(--cyan), #f6f1e9);
        animation: loop-meter 24s linear infinite;
      }

      .version {
        position: fixed;
        left: 18px;
        bottom: 26px;
        z-index: 2;
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.82);
      }

      @keyframes loop-meter {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      @media (max-width: 720px) {
        .hud { display: block; }
        a { display: inline-block; margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Tidal Coral Helix procedural preview"></canvas>
    <div class="hud">
      <div>
        <h1>Tidal Coral Helix</h1>
        <p>Organic Motion Objects / reef-like helix turntable / Blender + GLB + STL candidate</p>
      </div>
      <a href="../days/2026-08-11.html">Daily report</a>
    </div>
    <div class="meter" aria-hidden="true"><span></span></div>
    <div class="version">organic motion objects / 2026.08.11</div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

      const canvas = document.querySelector("#stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(0x050708, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050708, 0.018);

      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 90);
      camera.position.set(0, 0.72, 7.2);
      camera.lookAt(0, 0, 0);

      const clock = new THREE.Clock();
      const pointer = new THREE.Vector2();
      const targetPointer = new THREE.Vector2();

      const object = new THREE.Group();
      object.rotation.y = -0.58;
      scene.add(object);

      const coralTexture = createCoralTexture();
      const coralMesh = createCoralMesh(new THREE.MeshStandardMaterial({
        map: coralTexture,
        color: 0xff9aa3,
        emissive: 0x2a0710,
        emissiveIntensity: 0.22,
        roughness: 0.42,
        metalness: 0.0,
      }));
      object.add(coralMesh);

      const floor = new THREE.GridHelper(7.5, 42, 0x4c3940, 0x101719);
      floor.position.y = -2.1;
      floor.material.transparent = true;
      floor.material.opacity = 0.18;
      scene.add(floor);

      const key = new THREE.DirectionalLight(0xffa2aa, 3.6);
      key.position.set(-3.0, -2.4, 4.8);
      scene.add(key);

      const rim = new THREE.PointLight(0x7deaff, 6.4, 18);
      rim.position.set(3.0, 2.2, 2.8);
      scene.add(rim);

      const core = new THREE.PointLight(0x5be9ff, 4.8, 12);
      core.position.set(0, 0.1, 0);
      scene.add(core);

      const fill = new THREE.HemisphereLight(0xfff2f4, 0x35141c, 1.35);
      scene.add(fill);

      const front = new THREE.PointLight(0xffffff, 1.4, 24);
      front.position.set(0, 1.1, 5.4);
      scene.add(front);

      window.addEventListener("pointermove", (event) => {
        targetPointer.x = (event.clientX / window.innerWidth - 0.5) * 2;
        targetPointer.y = (event.clientY / window.innerHeight - 0.5) * -2;
      });

      window.addEventListener("click", () => {
        object.rotation.y += Math.PI / 5;
      });

      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(render);

      function render() {
        const elapsed = clock.getElapsedTime();
        pointer.lerp(targetPointer, 0.08);
        object.rotation.y = -0.58 + elapsed * Math.PI * 2 / 24 + pointer.x * 0.18;
        object.rotation.x = -0.08 + pointer.y * 0.08 + Math.sin(elapsed * 0.42) * 0.018;
        object.position.y = Math.sin(elapsed * 0.55) * 0.035;
        renderer.render(scene, camera);
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function createCoralMesh(material, scale = 1) {
        const radial = 168;
        const vertical = 132;
        const positions = [];
        const normals = [];
        const uvs = [];
        const indices = [];
        for (let y = 0; y <= vertical; y += 1) {
          const v = y / vertical;
          for (let x = 0; x < radial; x += 1) {
            const u = x / radial;
            const sample = coralPoint(u, v, scale);
            positions.push(sample.position.x, sample.position.y, sample.position.z);
            normals.push(sample.normal.x, sample.normal.y, sample.normal.z);
            uvs.push(u, 1 - v);
          }
        }
        for (let y = 0; y < vertical; y += 1) {
          for (let x = 0; x < radial; x += 1) {
            const a = y * radial + x;
            const b = y * radial + ((x + 1) % radial);
            const c = (y + 1) * radial + ((x + 1) % radial);
            const d = (y + 1) * radial + x;
            indices.push(a, b, d, b, c, d);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material || new THREE.MeshStandardMaterial({
          color: 0xffa0aa,
          emissive: 0x9b2638,
          emissiveIntensity: 0.9,
          roughness: 0.22,
          metalness: 0.0,
        }));
      }

      function createCoralTexture() {
        const textureCanvas = document.createElement("canvas");
        textureCanvas.width = 1024;
        textureCanvas.height = 1024;
        const context = textureCanvas.getContext("2d");
        const gradient = context.createLinearGradient(0, 0, 1024, 1024);
        gradient.addColorStop(0, "#ff8390");
        gradient.addColorStop(0.42, "#d84f66");
        gradient.addColorStop(1, "#7d2435");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 1024, 1024);

        context.globalAlpha = 0.075;
        for (let y = -120; y < 1120; y += 54) {
          context.strokeStyle = y % 108 === 0 ? "#ffb4bd" : "#be354b";
          context.lineWidth = y % 108 === 0 ? 3 : 2;
          context.beginPath();
          context.moveTo(-80, y);
          for (let x = -80; x <= 1120; x += 80) {
            context.lineTo(x, y + Math.sin(x * 0.022 + y * 0.01) * 22 + x * 0.18);
          }
          context.stroke();
        }

        context.globalAlpha = 0.045;
        for (let i = 0; i < 420; i += 1) {
          const x = (Math.sin(i * 12.9898) * 43758.5453) % 1;
          const y = (Math.sin(i * 78.233) * 24634.6345) % 1;
          const px = Math.abs(x) * 1024;
          const py = Math.abs(y) * 1024;
          const radius = 0.7 + (i % 7) * 0.22;
          context.fillStyle = i % 5 === 0 ? "#ffb8c2" : "#7b1f30";
          context.beginPath();
          context.arc(px, py, radius, 0, Math.PI * 2);
          context.fill();
        }

        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2.4, 1.15);
        texture.anisotropy = 8;
        return texture;
      }

      function coralPoint(u, v, scale = 1) {
        const angle = u * Math.PI * 2 + v * Math.PI * 2 * 0.82;
        const radius = radiusAt(u, v) * scale;
        const oval = 0.82 + 0.08 * Math.sin(v * Math.PI * 2 * 3);
        const position = new THREE.Vector3(Math.cos(angle) * radius, (v - 0.5) * 4.15, Math.sin(angle) * radius * oval);
        const normal = new THREE.Vector3(Math.cos(angle), 0.08 * Math.sin(v * Math.PI * 6), Math.sin(angle)).normalize();
        return { position, normal };
      }

      function radiusAt(u, v) {
        const profile = Math.pow(Math.sin(v * Math.PI), 0.58);
        const waist = 0.62 + 1.0 * profile;
        const taper = -0.24 * Math.exp(-(((v - 0.92) / 0.08) ** 2)) - 0.19 * Math.exp(-(((v - 0.06) / 0.06) ** 2));
        const helix = Math.sin(u * Math.PI * 2 * 5 + v * Math.PI * 2 * 2.35) * 0.13;
        const coral = Math.sin(u * Math.PI * 2 * 17 - v * 11) * 0.05;
        const tide = Math.cos(u * Math.PI * 2 * 9 + v * 18) * 0.038;
        return waist + taper + (helix + coral + tide) * profile;
      }

      function wrap01(value) {
        return ((value % 1) + 1) % 1;
      }
    </script>
  </body>
</html>
