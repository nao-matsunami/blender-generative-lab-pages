<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Processional Aperture Engine / Blender Generative Lab</title>
    <style>
      :root{color-scheme:dark;--ink:#eee8dd;--muted:#a9a098;--accent:#a96936}
      *{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#030202;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
      .hud{position:fixed;z-index:2;inset:18px 18px auto;display:flex;justify-content:space-between;gap:20px;pointer-events:none;text-shadow:0 2px 20px #000}.hud div{max-width:780px}h1{margin:0;font-size:clamp(22px,3vw,43px);line-height:1;letter-spacing:0;text-transform:uppercase}p{margin:9px 0 0;color:var(--muted);font-size:clamp(12px,1.25vw,15px);line-height:1.55}.hud a{pointer-events:auto;flex:none;padding:10px 13px;border:1px solid rgba(238,232,221,.26);color:var(--ink);background:rgba(3,2,2,.7);font-size:12px;text-decoration:none;backdrop-filter:blur(12px)}
      .label,.motion{position:fixed;z-index:2;bottom:18px;font-size:10px;text-transform:uppercase;pointer-events:none}.label{left:18px;color:var(--accent)}.motion{right:18px;color:#80766d}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#8f8379;font-size:12px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .35s}.ready{opacity:0}
      @media(max-width:720px){.hud{display:block}.hud a{display:inline-block;margin-top:12px}.motion{display:none}}
    </style>
  </head>
  <body>
    <script>if(location.protocol==="file:")location.replace("https://nao-matsunami.github.io/blender-generative-lab-pages/outputs/2026-10-03_processional-aperture-engine.html");</script>
    <canvas id="stage" aria-label="Processional Aperture Engine interactive Blender model"></canvas>
    <div class="hud"><div><h1>Processional Aperture Engine</h1><p>Machine / ritual-object lane. A broken cast shell, offset gimbals, weighted grips, locking bar, and biological closure membranes recessed inside.</p></div><a href="../days/2026-10-03.html">Daily report</a></div>
    <div class="label">finished Blender GLB / 2026.10.03</div><div class="motion">drag rotate / pinch wheel zoom / two-finger pan</div><div class="loading" id="loading">Loading Blender asset</div>
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
    <script type="module">
      import * as THREE from "three";
      import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
      import {OrbitControls} from "three/addons/controls/OrbitControls.js";
      const canvas=document.querySelector("#stage"),loading=document.querySelector("#loading");
      const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});renderer.setClearColor(0x030202);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;
      const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030202,.0018);const camera=new THREE.PerspectiveCamera(38,1,.1,2000);camera.position.set(180,-360,130);
      const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.065;controls.minDistance=190;controls.maxDistance=680;controls.target.set(0,0,0);controls.autoRotate=true;controls.autoRotateSpeed=.42;
      scene.add(new THREE.HemisphereLight(0xffd6a8,0x080203,1.8));const key=new THREE.DirectionalLight(0xff9b55,5.8);key.position.set(-4,-5,7);scene.add(key);const rim=new THREE.DirectionalLight(0x9e1730,4.4);rim.position.set(5,2,-3);scene.add(rim);const fill=new THREE.PointLight(0xe0a464,3.2,700);fill.position.set(40,-100,100);scene.add(fill);
      let mixer=null;const clock=new THREE.Clock();new GLTFLoader().load("../exports/glb/processional-aperture-engine.glb",gltf=>{const root=gltf.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z);root.position.sub(center);controls.target.set(0,0,0);camera.position.set(span*.54,-span*1.02,span*.42);controls.minDistance=span*.48;controls.maxDistance=span*2.6;if(gltf.animations.length){mixer=new THREE.AnimationMixer(root);gltf.animations.forEach(clip=>mixer.clipAction(clip).play())}loading.classList.add("ready")},undefined,error=>{loading.textContent="Asset load failed";console.error(error)});
      canvas.addEventListener("pointerdown",()=>{controls.autoRotate=false},{once:true});addEventListener("resize",resize);resize();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)});
      function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
    </script>
  </body>
</html>
